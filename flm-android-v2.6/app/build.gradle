plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.falcon.flm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.falcon.flm'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '2.6'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pyc {
            src = true
            stdlib = true
        }
    }
}
