name: FLM v0.4 Train Watch and Verify

on:
  push:
    paths:
      - '.flm-watch-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install "kaggle>=2.2.1"

      - name: Wait for Kaggle accelerator training
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/falcon-flm-v04-three-model-suite"
          done_flag=0
          for attempt in $(seq 1 120); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "attempt=$attempt $STATUS"
            if echo "$STATUS" | grep -q 'KernelWorkerStatus.COMPLETE'; then
              done_flag=1
              break
            fi
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(ERROR|CANCELLED|FAILED)'; then
              echo "Kaggle training failed"
              kaggle kernels logs "$REF" || true
              exit 1
            fi
            sleep 10
          done
          test "$done_flag" = "1"

      - name: Fetch final training logs
        run: |
          kaggle kernels logs "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite" | tee /tmp/flm-kaggle.log
          grep -q 'suite_complete' /tmp/flm-kaggle.log
          grep -q '"kind": "main"' /tmp/flm-kaggle.log
          grep -q '"kind": "computer_use"' /tmp/flm-kaggle.log
          grep -q '"kind": "coder"' /tmp/flm-kaggle.log

      - name: Download and verify three models
        run: |
          set -euo pipefail
          mkdir -p outputs
          kaggle kernels output "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite" -p outputs -o
          find outputs -maxdepth 4 -type f -printf '%p %s bytes\n'

          ROOT="outputs/flm-v0.4"
          test -s "$ROOT/main/checkpoint.pt"
          test -s "$ROOT/main/metrics.json"
          test -s "$ROOT/computer_use/checkpoint.pt"
          test -s "$ROOT/computer_use/metrics.json"
          test -s "$ROOT/coder/checkpoint.pt"
          test -s "$ROOT/coder/metrics.json"
          test -s "$ROOT/suite_metrics.json"
          test -s "$ROOT/sources.json"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/flm-v0.4')
          src=json.loads((root/'sources.json').read_text())
          expected={
              'main':'codelion/fineweb-edu-100M',
              'coder':'Nan-Do/code-search-net-python',
              'computer_use':'markov-ai/computer-use',
          }
          for k,v in expected.items():
              assert src['sources'][k]['repo']==v,(k,src['sources'][k]['repo'])

          for name in ('main','computer_use','coder'):
              m=json.loads((root/name/'metrics.json').read_text())
              print(name,json.dumps(m,sort_keys=True))
              assert m['accelerator'] in ('gpu','tpu')
              assert m['parameters']>0
              assert m['eval_loss']>0
              if name=='computer_use':
                  assert 'op_accuracy' in m
                  assert m['vision']['vision_layers']>0

          suite=json.loads((root/'suite_metrics.json').read_text())
          assert len(suite['models'])==3
          print('ALL THREE REAL-DATA MODELS VERIFIED')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: flm-v04-real-hf-three-models
          path: outputs/flm-v0.4/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
