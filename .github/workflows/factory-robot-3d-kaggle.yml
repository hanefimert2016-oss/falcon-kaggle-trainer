name: Factory Robot 3D - Kaggle T4

on:
  push:
    branches:
      - factory-robot-3d-public-run
    paths:
      - 'factory_robot_3d/**'
      - '.github/workflows/factory-robot-3d-kaggle.yml'
      - '.factory-robot-3d-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-robot-3d-kaggle-public-run
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KAGGLE_KERNEL_SLUG: factory-robot-3d-video
      KAGGLE_ACCELERATOR: NvidiaTeslaT4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate source and Kaggle bridge
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile factory_robot_3d/simulate.py
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing KAGGLE_API_TOKEN secret" && exit 1)
          test -n "$KAGGLE_OWNER" || (echo "Missing KAGGLE_OWNER repository variable" && exit 1)
          echo "Owner=$KAGGLE_OWNER"
          echo "Accelerator=$KAGGLE_ACCELERATOR"

      - name: Install Kaggle CLI
        run: python -m pip install -q "kaggle>=2.2.1"

      - name: Build public Kaggle kernel metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("factory_robot_3d")
          meta = {
              "id": f"{os.environ['KAGGLE_OWNER']}/{os.environ['KAGGLE_KERNEL_SLUG']}",
              "title": "Factory Robot 3D Video",
              "code_file": "simulate.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": False,
              "enable_gpu": True,
              "enable_internet": True,
              "machine_shape": os.environ["KAGGLE_ACCELERATOR"],
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          (root / "kernel-metadata.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Authenticate
        run: kaggle kernels list --mine --page-size 1

      - name: Clean up our earlier robot test kernel
        shell: bash
        run: |
          set +e
          kaggle kernels delete "$KAGGLE_OWNER/factory-robot-3d" -y
          sleep 5
          exit 0

      - name: Push 3D simulation to Kaggle T4
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p factory_robot_3d --accelerator "$KAGGLE_ACCELERATOR" --timeout 1800

      - name: Wait for simulation completion
        shell: bash
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/$KAGGLE_KERNEL_SLUG"
          for i in $(seq 1 120); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|finished'; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
              echo "Kaggle simulation failed"
              kaggle kernels logs "$REF" || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Kaggle simulation"
          kaggle kernels logs "$REF" || true
          exit 1

      - name: Show Kaggle logs
        if: always()
        shell: bash
        run: kaggle kernels logs "$KAGGLE_OWNER/$KAGGLE_KERNEL_SLUG" || true

      - name: Download rendered video and telemetry
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs
          mkdir -p outputs
          kaggle kernels output "$KAGGLE_OWNER/$KAGGLE_KERNEL_SLUG" -p outputs -o
          find outputs -maxdepth 4 -type f -printf '%p %s bytes\n'
          test -f outputs/factory_robot_3d_output/factory_robot_3d.mp4
          test -f outputs/factory_robot_3d_output/summary.json
          test -f outputs/factory_robot_3d_output/telemetry.csv
          cat outputs/factory_robot_3d_output/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("outputs/factory_robot_3d_output/summary.json").read_text())
          assert d["success"] is True, d
          assert d["frames"] > 100, d
          PY

      - name: Upload 3D simulation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factory-robot-3d-kaggle-t4-video
          path: outputs/factory_robot_3d_output/
          if-no-files-found: error
          retention-days: 7
