name: Iron Man v3 Progress Probe
on:
  push:
    paths:
      - '.github/workflows/ironman-v3-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet 'kaggle>=2.2.1'
      - name: Current Kaggle status and logs
        run: |
          set +e
          REF="$KAGGLE_OWNER/iron-man-systems-lab-v4"
          echo "=== STATUS ==="
          kaggle kernels status "$REF"
          echo "=== LOGS ==="
          kaggle kernels logs "$REF"
          exit 0
