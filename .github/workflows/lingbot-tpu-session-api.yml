name: LingBot TPU Interactive Session API

on:
  push:
    branches:
      - lingbot-tpu-v5e-port
    paths:
      - '.lingbot-tpu-session-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: lingbot-world-v2-interactive-tpu-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle SDK
        run: python -m pip install -q "kaggle>=2.2.1" kagglesdk

      - name: Create true interactive TPU session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import (
              ApiCreateKernelSessionRequest,
              ApiCancelKernelSessionRequest,
          )

          owner=os.environ["KAGGLE_OWNER"]
          slug=os.environ["KERNEL_SLUG"]
          full=f"{owner}/{slug}"

          api=KaggleApi()
          api.authenticate()

          req=ApiCreateKernelSessionRequest()
          req.slug=full
          req.language="python"
          req.kernel_type="script"
          req.machine_shape="TpuV5E8"
          req.enable_internet=True

          print("CREATE_SESSION", full, req.machine_shape, flush=True)
          with api.build_kaggle_client() as client:
              op=client.kernels.kernels_api_client.create_kernel_session(req)
              print("OP_NAME", op.name, flush=True)
              print("OP_DONE", op.done, flush=True)
              print("OP_METADATA", json.dumps(op.metadata or {}, default=str), flush=True)
              print("OP_RESPONSE", json.dumps(op.response or {}, default=str), flush=True)
              print("OP_ERROR", getattr(op.error, "code", None), getattr(op.error, "message", None), flush=True)

              state={
                  "name":op.name,
                  "done":op.done,
                  "metadata":op.metadata or {},
                  "response":op.response or {},
                  "error_code":getattr(op.error,"code",None),
                  "error_message":getattr(op.error,"message",None),
                  "machine_shape":"TpuV5E8",
                  "kernel":full,
              }

              # Poll the long-running operation itself. This is interactive
              # session allocation, not a batch kernel run.
              for i in range(120):
                  if op.done:
                      break
                  time.sleep(5)
                  op=client.common.operations_client.get_operation(name=op.name)
                  print("POLL", i+1, "done=", op.done,
                        "metadata=", json.dumps(op.metadata or {}, default=str),
                        "response=", json.dumps(op.response or {}, default=str),
                        "error=", getattr(op.error,"code",None),
                        getattr(op.error,"message",None), flush=True)
                  state.update({
                      "done":op.done,
                      "metadata":op.metadata or state["metadata"],
                      "response":op.response or state["response"],
                      "error_code":getattr(op.error,"code",None),
                      "error_message":getattr(op.error,"message",None),
                  })
                  open("lingbot_tpu_session.json","w").write(json.dumps(state,indent=2,default=str)+"\n")

              open("lingbot_tpu_session.json","w").write(json.dumps(state,indent=2,default=str)+"\n")

              # Deliberately leave a successfully allocated session alive for
              # the next control step. If allocation failed, nothing to cancel.
              if state["error_code"]:
                  raise SystemExit(f"Interactive TPU session failed: {state['error_code']} {state['error_message']}")
          PY

      - name: Upload session state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingbot-tpu-interactive-session
          path: lingbot_tpu_session.json
          if-no-files-found: warn
