name: LingBot TPU UI Seed

on:
  push:
    branches:
      - lingbot-tpu-v5e-port
    paths:
      - '.lingbot-tpu-ui-seed-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: lingbot-world-v2-interactive-tpu-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1"
      - name: Build interactive seed notebook
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel_lingbot_ui
          mkdir -p kernel_lingbot_ui
          cp lingbot_tpu/apply_tpu_patch.py kernel_lingbot_ui/
          cp lingbot_tpu/generate_tpu.py kernel_lingbot_ui/
          cp lingbot_tpu/kaggle_tpu_v5e_test.py kernel_lingbot_ui/
          cat > kernel_lingbot_ui/kernel.py <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          cmd = [
              sys.executable,
              str(Path(__file__).with_name("kaggle_tpu_v5e_test.py")),
              "--profile", "interactive",
          ]
          p = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(p.stdout, flush=True)
          Path("/kaggle/working/lingbot_tpu_benchmark.log").write_text(p.stdout)
          Path("/kaggle/working/lingbot_tpu_exit_code.txt").write_text(str(p.returncode) + "\n")
          raise SystemExit(p.returncode)
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          owner=os.environ["KAGGLE_OWNER"]
          slug=os.environ["KERNEL_SLUG"]
          meta={
              "id": f"{owner}/{slug}",
              "title": "LingBot World V2 Interactive TPU V2",
              "code_file": "kernel.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": True,
              "enable_internet": True,
              "machine_shape": "TpuV5E8",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kernel_lingbot_ui/kernel-metadata.json").write_text(json.dumps(meta, indent=2)+"\n")
          print(json.dumps(meta, indent=2))
          PY
          python -m py_compile kernel_lingbot_ui/*.py
      - name: Seed Kaggle notebook source
        run: |
          kaggle kernels push -p kernel_lingbot_ui --timeout 3600
