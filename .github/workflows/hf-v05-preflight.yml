name: FLM v0.5 HF Source Preflight

on:
  push:
    paths:
      - '.hf-v05-preflight-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only data tooling
        run: python -m pip install "datasets>=4.0" pillow huggingface_hub
      - name: Probe all v0.5 sources on CPU
        run: |
          test -z "$CUDA_VISIBLE_DEVICES"
          python flm/data/preflight_v05.py
      - uses: actions/upload-artifact@v4
        with:
          name: flm-v05-source-preflight
          path: v05_preflight_report.json
          retention-days: 3
