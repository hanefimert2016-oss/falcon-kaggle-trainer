name: Kaggle Output Fetch

on:
  push:
    paths:
      - '.output-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG || 'falcon-flm-train' }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Download latest Kaggle output
        run: |
          mkdir -p outputs
          kaggle kernels output "$KAGGLE_OWNER/$KAGGLE_KERNEL_SLUG" -p outputs -o
      - name: Verify checkpoint
        run: |
          find outputs -maxdepth 3 -type f -printf '%p %s bytes\n'
          test -f outputs/flm-v0.2-smoke/checkpoint.pt
          test -f outputs/flm-v0.2-smoke/metrics.json
          cat outputs/flm-v0.2-smoke/metrics.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flm-v0.2-smoke-output
          path: outputs/flm-v0.2-smoke/
          if-no-files-found: error
          retention-days: 7
