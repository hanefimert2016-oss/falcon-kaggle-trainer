name: Falcon CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml pillow numpy tokenizers "datasets>=4.0"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Python compile
        run: |
          python -m py_compile             falconctl.py             kaggle/train_flm.py             scripts/colab_setup.py             scripts/build_kernel_bundle.py             flm/runtime.py             flm/models/text_lm.py             flm/models/computer_use.py             flm/models/computer_use_v2.py             flm/models/computer_use_v3.py             flm/computer_use/action_protocol.py             flm/computer_use/executor.py             flm/tooling/protocol.py             flm/tooling/runtime.py             flm/data/prepare_hf.py             flm/data/prepare_v05.py             flm/data/prepare_v06.py             flm/data/prepare_v07.py             flm/data/preflight_v05.py             flm/train_v05.py             flm/train_v06.py             flm/train_v07.py             flm/computer_use/agent.py             flm/train_text.py             flm/train_computer_use.py             flm/train_suite.py             run_flm_v06.py             scripts/validate_v06_quality.py             scripts/build_kernel_bundle_v07.py             scripts/validate_v07_quality.py             scripts/run_computer_use_v07.py

      - name: Unit tests
        run: pytest -q

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(p.read_text())
              assert isinstance(data, dict) and 'jobs' in data, p
              print('OK', p)
          PY

      - name: Validate Colab notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('colab/Falcon_FLM_Trainer.ipynb')
          nb=json.loads(p.read_text())
          assert nb['nbformat']==4
          print('OK',p,'cells=',len(nb['cells']))
          PY

      - name: Build GPU Kaggle bundle
        run: |
          python scripts/build_kernel_bundle.py --owner test-owner --accelerator NvidiaTeslaT4 --profile fast --out /tmp/kernel_gpu
          python - <<'PY'
          import pathlib,json
          gpu=(pathlib.Path('/tmp/kernel_gpu')/'train_suite.py').read_text()
          assert 'FLM_ACCELERATOR"] = "gpu"' in gpu
          gm=json.loads((pathlib.Path('/tmp/kernel_gpu')/'kernel-metadata.json').read_text())
          assert gm['enable_gpu'] is True
          assert gm['machine_shape']=='NvidiaTeslaT4'
          assert gm['enable_internet'] is False
          print('GPU bundle OK')
          PY

      - name: Kaggle nested mount discovery regression
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from flm import train_suite
          root=Path('/tmp/kaggle-input/nested-dataset-v04')
          root.mkdir(parents=True, exist_ok=True)
          manifest={
            'sources':{
              'main':{'repo':'codelion/fineweb-edu-100M'},
              'coder':{'repo':'Nan-Do/code-search-net-python'},
              'computer_use':{'repo':'markov-ai/computer-use'},
            }
          }
          (root/'sources.json').write_text(json.dumps(manifest))
          old=train_suite.Path
          orig_exists=Path('/kaggle/input').exists()
          os.environ['FLM_DATA_ROOT']=str(root.parent)
          resolved=train_suite.resolve_data_root()
          assert resolved==root.resolve(), (resolved,root)
          print('nested data root discovery OK',resolved)
          PY

      - name: Computer-use mounted image directory regression
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_COMPUTER_STEPS: "1"
          FLM_COMPUTER_BATCH: "1"
          FLM_COMPUTER_IMAGE_SIZE: "32"
          FLM_COMPUTER_EMBD: "32"
          FLM_COMPUTER_HEADS: "2"
          FLM_COMPUTER_TEXT_LAYERS: "1"
          FLM_COMPUTER_VISION_LAYERS: "1"
          FLM_COMPUTER_TASK_LEN: "24"
          FLM_COMPUTER_ACTION_LEN: "24"
          FLM_COMPUTER_EVAL_BATCHES: "1"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('/tmp/cu-mounted')
          images=root/'computer_images'
          images.mkdir(parents=True,exist_ok=True)
          rows=[]
          for i,(op,action) in enumerate([
              ('CLICK','pyautogui.click(40,20)'),
              ('TYPE',"pyautogui.write('hello')"),
              ('SCROLL','pyautogui.scroll(-3)'),
              ('KEY',"pyautogui.hotkey('ctrl','l')"),
          ]):
              im=Image.new('RGB',(64,64),'white')
              ImageDraw.Draw(im).rectangle((8+i*3,8,32+i*3,30),outline='black')
              name=f'{i}.jpg'
              im.save(images/name)
              rows.append({'image':name,'task':'Interact with visible UI','action':action,'operation':op})
          (root/'computer_manifest.jsonl').write_text('\n'.join(json.dumps(x) for x in rows))
          from flm.train_computer_use import train_computer
          out=Path('/tmp/cu-mounted-out')
          result=train_computer(root,out)
          assert result['eval_loss']>0
          assert (out/'computer_use/checkpoint.pt').stat().st_size>0
          print('mounted image dir regression OK')
          PY

      - name: FLM v0.7 real input executor regression
        run: |
          python - <<'PY'
          from flm.computer_use.action_protocol import Action,ActionType,parse_action
          from flm.computer_use.executor import DryRunBackend,HumanInputExecutor,ScreenGeometry

          backend=DryRunBackend()
          ex=HumanInputExecutor(backend,ScreenGeometry(1920,1080),sleep_enabled=False,seed=1)
          actions=[
              parse_action('{"type":"click","x":0.5,"y":0.25}'),
              Action(ActionType.TYPE,text='hello').validate(),
              Action(ActionType.KEY,keys=('ctrl','l')).validate(),
              Action(ActionType.DRAG,x=.1,y=.2,x2=.8,y2=.7,duration=.2).validate(),
              Action(ActionType.SCROLL,scroll_y=-4).validate(),
              Action(ActionType.DONE).validate(),
          ]
          done=[]
          for a in actions:
              done.append(ex.execute(a)['done'])
          assert done[-1] is True and not any(done[:-1])
          assert any(e[0]=='click' for e in backend.events)
          assert any(e[0]=='write' for e in backend.events)
          assert any(e[0]=='hotkey' for e in backend.events)
          assert any(e[0]=='drag_to' for e in backend.events)
          assert any(e[0]=='scroll' for e in backend.events)
          # Human-like movement must create intermediate mouse moves.
          assert sum(e[0]=='move_to' for e in backend.events) >= 4
          print('v0.7 real-input executor dry-run OK events=',len(backend.events))
          PY

      - name: FLM v0.7 real X11 mouse keyboard integration
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm xclip xdotool
          python -m pip install pyautogui mss
          touch "$HOME/.Xauthority"
          Xvfb :99 -ac -screen 0 1024x768x24 >/tmp/flm-xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1
          xterm -T FLMInputTest -geometry 80x24+80+80 -e bash -lc 'IFS= read -r line; printf "%s" "$line" >/tmp/flm-x11-input.txt; sleep 1' >/tmp/flm-xterm.log 2>&1 &
          sleep 1
          WIN="$(xdotool search --name FLMInputTest | head -n1)"
          test -n "$WIN"
          xdotool windowfocus "$WIN"
          python - <<'PY'
          import time
          from pathlib import Path
          from flm.computer_use.action_protocol import Action,ActionType
          from flm.computer_use.executor import HumanInputExecutor,PyAutoGUIBackend,ScreenGeometry
          from flm.computer_use.agent import MSSCapture

          cap=MSSCapture(1)
          geo=cap.geometry()
          assert geo.width==1024 and geo.height==768,(geo.width,geo.height)
          shot=cap.capture()
          assert shot.size==(1024,768),shot.size

          backend=PyAutoGUIBackend(fail_safe=False)
          ex=HumanInputExecutor(backend,ScreenGeometry(1024,768),sleep_enabled=False,seed=7)
          ex.execute(Action(ActionType.MOVE,x=.5,y=.5).validate())
          px,py=backend.position()
          assert abs(px-512)<8 and abs(py-384)<8,(px,py)

          # Real X11 keyboard events, including Turkish Unicode through xclip.
          ex.execute(Action(ActionType.TYPE,text='merhaba dünya çığöşü').validate())
          ex.execute(Action(ActionType.KEY,keys=('enter',)).validate())
          target=Path('/tmp/flm-x11-input.txt')
          for _ in range(40):
              if target.exists():
                  break
              time.sleep(.1)
          assert target.exists(),'xterm did not receive keyboard input'
          value=target.read_text(encoding='utf-8')
          assert value=='merhaba dünya çığöşü',repr(value)
          print('REAL_X11_INPUT_OK',px,py,value)
          PY

      - name: FLM v0.7 tool-call protocol regression
        run: |
          python - <<'PY'
          from flm.tooling import ToolCall,ToolRegistry,extract_tool_calls,format_tool_call,run_tool_loop
          call=ToolCall('add',{'a':2,'b':3},'c1')
          encoded=format_tool_call(call)
          decoded=extract_tool_calls(encoded)
          assert decoded==[call],(encoded,decoded)

          reg=ToolRegistry()
          reg.register('add',lambda a,b:a+b,description='Add numbers',schema={
              'type':'object',
              'properties':{'a':{'type':'number'},'b':{'type':'number'}},
              'required':['a','b'],
          })
          def gen(history):
              if not any(x.get('role')=='tool' for x in history):
                  return '<|tool_call|>{"name":"add","arguments":{"a":2,"b":3},"id":"c1"}<|tool_end|>'
              return 'Sonuç 5.'
          out,h=run_tool_loop(gen,[{'role':'user','content':'2+3 kaç?'}],reg)
          assert out=='Sonuç 5.'
          assert any(x.get('role')=='tool' and '"result":5' in x['content'] for x in h)
          print('v0.7 tool runtime OK')
          PY

      - name: FLM v0.7 ComputerUse pointer-policy regression
        run: |
          python - <<'PY'
          import torch
          from flm.models.computer_use_v3 import ComputerUseV3,ComputerUseV3Config
          cfg=ComputerUseV3Config(
              text_vocab=128,task_len=16,image_size=32,patch=16,
              embd=32,text_layers=1,vision_layers=1,n_head=4,
              num_ops=12,num_domains=16,payload_len=12,
          )
          m=ComputerUseV3(cfg)
          b=2
          img=torch.randn(b,3,32,32)
          task=torch.randint(1,128,(b,16))
          pin=torch.randint(0,255,(b,12))
          ptgt=torch.randint(0,255,(b,12))
          out,loss,parts=m(
              img,task,pin,
              op_target=torch.tensor([1,4]),
              op_valid=torch.ones(b,dtype=torch.bool),
              pointer_target=torch.tensor([0,3]),
              pointer_valid=torch.ones(b,dtype=torch.bool),
              pointer2_target=torch.tensor([2,1]),
              pointer2_valid=torch.tensor([0,1],dtype=torch.bool),
              domain_target=torch.tensor([1,2]),
              domain_valid=torch.ones(b,dtype=torch.bool),
              payload_target=ptgt,
              payload_valid=torch.ones(b,dtype=torch.bool),
          )
          assert torch.isfinite(loss),loss
          assert out['pointer_logits'].shape==(2,4)
          assert out['coord'].shape==(2,2)
          assert torch.all((out['coord']>=0)&(out['coord']<=1))
          loss.backward()
          pred=m.predict(img,task)
          assert pred['coord'].shape==(2,2)
          assert len(pred['payload'])==2
          print('v0.7 pointer policy OK loss=',float(loss.detach()))
          PY

      - name: FLM v0.7 Kaggle metadata title regression
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('flm/data/prepare_v07.py').read_text(encoding='utf-8')
          title='FLM v0.7 Bilingual Tool Desktop Data'
          assert title in text
          assert 6 <= len(title) <= 50,len(title)
          print('v0.7 Kaggle title OK',len(title))
          PY

      - name: FLM v0.7 data/action parser regression
        run: |
          python - <<'PY'
          import json
          from flm.data.prepare_v07 import parse_pyautogui_action
          a=parse_pyautogui_action("pyautogui.click(960, 540, clicks=1, button='left')",1920,1080)
          assert a['op']=='CLICK' and abs(a['coord'][0]-.5)<.01 and abs(a['coord'][1]-.5)<.01,a
          a=parse_pyautogui_action("pyautogui.write('hello world')",1920,1080)
          assert a=={'op':'TYPE','coord':None,'coord2':None,'payload':'hello world'},a
          a=parse_pyautogui_action("pyautogui.hotkey('ctrl','l')",1920,1080)
          assert a['op']=='KEY' and a['payload']=='ctrl+l',a
          a=parse_pyautogui_action("pyautogui.scroll(-5)",1920,1080)
          assert a['op']=='SCROLL' and a['payload']=='0,-5',a
          a=parse_pyautogui_action("pyautogui.moveTo(100,200); pyautogui.dragTo(900,700,duration=.4)",1000,800)
          assert a['op']=='DRAG' and a['coord'] and a['coord2'],a
          assert parse_pyautogui_action("BrowserTools.open_privacy_settings()",1920,1080) is None
          print('v0.7 safe pyautogui parser OK')
          PY

      - name: FLM v0.7 chat/tool token-mask regression
        run: |
          python - <<'PY'
          import json
          import numpy as np
          from pathlib import Path
          from tokenizers import Tokenizer
          from tokenizers.models import BPE
          from tokenizers.pre_tokenizers import ByteLevel
          from tokenizers.decoders import ByteLevel as ByteLevelDecoder
          from tokenizers.trainers import BpeTrainer
          from flm.data.prepare_v07 import SPECIAL,encode_chat_sft

          root=Path('/tmp/v07-chat'); root.mkdir(exist_ok=True)
          corpus=root/'c.txt'
          corpus.write_text(('Merhaba hello Python tool call result assistant user system. '*1000),encoding='utf-8')
          tok=Tokenizer(BPE(unk_token='<unk>'))
          tok.pre_tokenizer=ByteLevel(add_prefix_space=False)
          tok.decoder=ByteLevelDecoder()
          tok.train([str(corpus)],BpeTrainer(vocab_size=512,min_frequency=1,special_tokens=SPECIAL))
          src=root/'sft.jsonl'
          src.write_text(json.dumps({'messages':[
              {'role':'system','content':'Available tool add.'},
              {'role':'user','content':'2+3'},
              {'role':'assistant','content':'<|tool_call|>{"name":"add","arguments":{"a":2,"b":3}}<|tool_end|>'},
              {'role':'tool','content':'<|tool_result|>{"name":"add","result":5}<|tool_end|>'},
              {'role':'assistant','content':'Sonuç 5.'},
          ]},ensure_ascii=False)+'\n')
          st=encode_chat_sft(tok,src,root/'t.u16',root/'m.u8')
          t=np.fromfile(root/'t.u16',dtype=np.uint16)
          m=np.fromfile(root/'m.u8',dtype=np.uint8)
          assert len(t)==len(m)==st['tokens']
          assert 0<m.sum()<len(m)
          assert st['assistant_turns']==2
          for special in ('<|tool_call|>','<|tool_result|>','<|tool_end|>'):
              assert tok.token_to_id(special) is not None
          print('v0.7 tool/chat SFT mask OK',st)
          PY

      - name: FLM v0.7 model parameters and GPU bundle
        run: |
          python - <<'PY'
          import gc
          from flm.models.text_lm import ByteCausalLM,TextConfig
          from flm.models.computer_use_v3 import ComputerUseV3,ComputerUseV3Config
          def count(m): return sum(p.numel() for p in m.parameters())
          main=ByteCausalLM(TextConfig(vocab_size=16384,seq_len=512,n_layer=14,n_head=12,n_embd=768))
          n=count(main); print('v07 main params',n); assert 110_000_000 <= n <= 120_000_000
          del main; gc.collect()
          coder=ByteCausalLM(TextConfig(vocab_size=16384,seq_len=512,n_layer=12,n_head=12,n_embd=768))
          n=count(coder); print('v07 coder params',n); assert 95_000_000 <= n <= 105_000_000
          del coder; gc.collect()
          cu=ComputerUseV3(ComputerUseV3Config())
          n=count(cu); print('v07 CU params',n); assert 100_000_000 <= n <= 125_000_000
          del cu; gc.collect()
          PY
          python scripts/build_kernel_bundle_v07.py --owner test-owner --profile pilot --out /tmp/v07
          python -m py_compile /tmp/v07/train_v07.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads((Path('/tmp/v07')/'kernel-metadata.json').read_text())
          assert m['id']=='test-owner/falcon-flm-v07-pilot-gpu'
          assert m['dataset_sources']==['test-owner/flm-hf-v07','test-owner/flm-hf-v05']
          assert m['machine_shape']=='NvidiaTeslaT4'
          assert m['enable_gpu'] is True and m['enable_internet'] is False
          s=(Path('/tmp/v07')/'train_v07.py').read_text()
          for key in ('FLM_V07_MAIN_SFT_STEPS','FLM_V07_CODER_SFT_STEPS','FLM_V07_CU_STEPS'):
              assert key in s,key
          print('v0.7 GPU bundle OK')
          PY

      - name: FLM v0.5 parameter targets
        run: |
          python - <<'PY'
          import gc
          from flm.models.text_lm import ByteCausalLM, TextConfig
          from flm.models.computer_use_v2 import ComputerUseV2, ComputerUseV2Config

          def count(m): return sum(p.numel() for p in m.parameters())

          main=ByteCausalLM(TextConfig(seq_len=1024,n_layer=14,n_head=12,n_embd=768))
          main_n=count(main); print('FLM-Main-v05 params=',main_n)
          assert 95_000_000 <= main_n <= 110_000_000
