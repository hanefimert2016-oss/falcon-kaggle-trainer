                  bbox_target=torch.zeros(b,4),
                  bbox_valid=valid,
                  domain_target=torch.zeros(b,dtype=torch.long),
                  domain_valid=torch.ones(b,dtype=torch.bool),
                  action_target=torch.zeros(b,12,dtype=torch.long),
                  action_valid=~valid,
              )
              return loss,parts
          l1,p1=run(True)
          l2,p2=run(False)
          expected={'op','coord','bbox','domain','action'}
          assert set(p1)==expected, p1.keys()
          assert set(p2)==expected, p2.keys()
          assert torch.isfinite(l1) and torch.isfinite(l2)
          (l1+l2).backward()
          print('stable ComputerUse loss keys OK',sorted(expected))
