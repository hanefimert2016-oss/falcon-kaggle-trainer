      - name: FLM v0.7 tool-call protocol regression
        run: |
          python - <<'PY'
          from flm.tooling import ToolCall,ToolRegistry,extract_tool_calls,format_tool_call,run_tool_loop
          call=ToolCall('add',{'a':2,'b':3},'c1')
          encoded=format_tool_call(call)
          decoded=extract_tool_calls(encoded)
          assert decoded==[call],(encoded,decoded)

          reg=ToolRegistry()
          reg.register('add',lambda a,b:a+b,description='Add numbers',schema={
              'type':'object',
              'properties':{'a':{'type':'number'},'b':{'type':'number'}},
              'required':['a','b'],
          })
          def gen(history):
              if not any(x.get('role')=='tool' for x in history):
                  return '<|tool_call|>{"name":"add","arguments":{"a":2,"b":3},"id":"c1"}<|tool_end|>'
              return 'Sonuç 5.'
          out,h=run_tool_loop(gen,[{'role':'user','content':'2+3 kaç?'}],reg)
          assert out=='Sonuç 5.'
          assert any(x.get('role')=='tool' and '"result":5' in x['content'] for x in h)
          print('v0.7 tool runtime OK')
          PY

