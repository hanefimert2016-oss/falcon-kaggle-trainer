name: Falcon CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m py_compile falconctl.py kaggle/train_flm.py
      - run: pytest -q
      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(p.read_text())
              assert isinstance(data, dict) and 'jobs' in data, p
              print('OK', p)
          PY
      - name: Model forward/backward smoke test
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          import torch
          p = Path('kaggle/train_flm.py')
          spec = importlib.util.spec_from_file_location('train_flm', p)
          m = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = m
          spec.loader.exec_module(m)
          cfg = m.Config(seq_len=16, n_layer=1, n_head=2, n_embd=32, batch_size=2, grad_accum=1, max_steps=1)
          model = m.FLM(cfg)
          x = torch.randint(0, 256, (2, 16))
          y = torch.randint(0, 256, (2, 16))
          _, loss = model(x, y)
          assert loss is not None and torch.isfinite(loss)
          loss.backward()
          print('OK loss=', float(loss.detach()))
          PY
