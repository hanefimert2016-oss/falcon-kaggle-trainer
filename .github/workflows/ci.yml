name: Falcon CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml pillow numpy

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Python compile
        run: |
          python -m py_compile             falconctl.py             kaggle/train_flm.py             scripts/colab_setup.py             scripts/build_kernel_bundle.py             flm/runtime.py             flm/models/text_lm.py             flm/models/computer_use.py             flm/data/prepare_hf.py             flm/train_text.py             flm/train_computer_use.py             flm/train_suite.py

      - name: Unit tests
        run: pytest -q

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(p.read_text())
              assert isinstance(data, dict) and 'jobs' in data, p
              print('OK', p)
          PY

      - name: Validate Colab notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('colab/Falcon_FLM_Trainer.ipynb')
          nb = json.loads(p.read_text())
          assert nb['nbformat'] == 4
          print('OK', p, 'cells=', len(nb['cells']))
          PY

      - name: Build Kaggle bundle
        run: |
          python scripts/build_kernel_bundle.py             --owner test-owner             --accelerator NvidiaTeslaT4             --out /tmp/kernel_bundle
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/kernel_bundle')
          meta=json.loads((root/'kernel-metadata.json').read_text())
          assert meta['dataset_sources'] == ['test-owner/flm-hf-v04']
          assert meta['enable_internet'] is False
          assert meta['enable_gpu'] is True
          assert (root/'flm/models/computer_use.py').is_file()
          print('bundle OK')
          PY

      - name: Main and coder 1-step CPU training
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_SEQ_LEN: "16"
          FLM_LAYERS: "1"
          FLM_HEADS: "2"
          FLM_EMBD: "32"
          FLM_BATCH: "2"
          FLM_GRAD_ACCUM: "1"
          FLM_MAIN_STEPS: "1"
          FLM_CODER_STEPS: "1"
        run: |
          mkdir -p /tmp/flm-data
          printf 'Falcon main real pipeline regression text. %.0s' {1..200} > /tmp/flm-data/main_train.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/flm-data/coder_train.jsonl')
          rows=[
            {'instruction':'Return the sum of two integers.','code':'def add(a, b):\n    return a + b\n'},
            {'instruction':'Compute factorial recursively.','code':'def fact(n):\n    return 1 if n < 2 else n * fact(n-1)\n'}
          ] * 30
          p.write_text('\n'.join(json.dumps(x) for x in rows))
          PY
          python - <<'PY'
          from pathlib import Path
          from flm.train_text import train_text
          root=Path('/tmp/flm-data')
          out=Path('/tmp/flm-out')
          train_text('main', root, out)
          train_text('coder', root, out)
          assert (out/'main/checkpoint.pt').stat().st_size > 0
          assert (out/'coder/checkpoint.pt').stat().st_size > 0
          print('text training OK')
          PY
