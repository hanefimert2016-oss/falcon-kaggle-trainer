name: Falcon CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml pillow numpy

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Python compile
        run: |
          python -m py_compile             falconctl.py             kaggle/train_flm.py             scripts/colab_setup.py             scripts/build_kernel_bundle.py             flm/runtime.py             flm/models/text_lm.py             flm/models/computer_use.py             flm/models/computer_use_v2.py             flm/data/prepare_hf.py             flm/data/prepare_v05.py             flm/data/preflight_v05.py             flm/train_v05.py             flm/train_text.py             flm/train_computer_use.py             flm/train_suite.py

      - name: Unit tests
        run: pytest -q

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(p.read_text())
              assert isinstance(data, dict) and 'jobs' in data, p
              print('OK', p)
          PY

      - name: Validate Colab notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('colab/Falcon_FLM_Trainer.ipynb')
          nb=json.loads(p.read_text())
          assert nb['nbformat']==4
          print('OK',p,'cells=',len(nb['cells']))
          PY

      - name: Build GPU Kaggle bundle
        run: |
          python scripts/build_kernel_bundle.py --owner test-owner --accelerator NvidiaTeslaT4 --profile fast --out /tmp/kernel_gpu
          python - <<'PY'
          import pathlib,json
          gpu=(pathlib.Path('/tmp/kernel_gpu')/'train_suite.py').read_text()
          assert 'FLM_ACCELERATOR"] = "gpu"' in gpu
          gm=json.loads((pathlib.Path('/tmp/kernel_gpu')/'kernel-metadata.json').read_text())
          assert gm['enable_gpu'] is True
          assert gm['machine_shape']=='NvidiaTeslaT4'
          assert gm['enable_internet'] is False
          print('GPU bundle OK')
          PY

      - name: Kaggle nested mount discovery regression
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from flm import train_suite
          root=Path('/tmp/kaggle-input/nested-dataset-v04')
          root.mkdir(parents=True, exist_ok=True)
          manifest={
            'sources':{
              'main':{'repo':'codelion/fineweb-edu-100M'},
              'coder':{'repo':'Nan-Do/code-search-net-python'},
              'computer_use':{'repo':'markov-ai/computer-use'},
            }
          }
          (root/'sources.json').write_text(json.dumps(manifest))
          old=train_suite.Path
          orig_exists=Path('/kaggle/input').exists()
          os.environ['FLM_DATA_ROOT']=str(root.parent)
          resolved=train_suite.resolve_data_root()
          assert resolved==root.resolve(), (resolved,root)
          print('nested data root discovery OK',resolved)
          PY

      - name: Computer-use mounted image directory regression
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_COMPUTER_STEPS: "1"
          FLM_COMPUTER_BATCH: "1"
          FLM_COMPUTER_IMAGE_SIZE: "32"
          FLM_COMPUTER_EMBD: "32"
          FLM_COMPUTER_HEADS: "2"
          FLM_COMPUTER_TEXT_LAYERS: "1"
          FLM_COMPUTER_VISION_LAYERS: "1"
          FLM_COMPUTER_TASK_LEN: "24"
          FLM_COMPUTER_ACTION_LEN: "24"
          FLM_COMPUTER_EVAL_BATCHES: "1"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('/tmp/cu-mounted')
          images=root/'computer_images'
          images.mkdir(parents=True,exist_ok=True)
          rows=[]
          for i,(op,action) in enumerate([
              ('CLICK','pyautogui.click(40,20)'),
              ('TYPE',"pyautogui.write('hello')"),
              ('SCROLL','pyautogui.scroll(-3)'),
              ('KEY',"pyautogui.hotkey('ctrl','l')"),
          ]):
              im=Image.new('RGB',(64,64),'white')
              ImageDraw.Draw(im).rectangle((8+i*3,8,32+i*3,30),outline='black')
              name=f'{i}.jpg'
              im.save(images/name)
              rows.append({'image':name,'task':'Interact with visible UI','action':action,'operation':op})
          (root/'computer_manifest.jsonl').write_text('\n'.join(json.dumps(x) for x in rows))
          from flm.train_computer_use import train_computer
          out=Path('/tmp/cu-mounted-out')
          result=train_computer(root,out)
          assert result['eval_loss']>0
          assert (out/'computer_use/checkpoint.pt').stat().st_size>0
          print('mounted image dir regression OK')
          PY

      - name: FLM v0.5 parameter targets
        run: |
          python - <<'PY'
          import gc
          from flm.models.text_lm import ByteCausalLM, TextConfig
          from flm.models.computer_use_v2 import ComputerUseV2, ComputerUseV2Config

          def count(m): return sum(p.numel() for p in m.parameters())

          main=ByteCausalLM(TextConfig(seq_len=1024,n_layer=14,n_head=12,n_embd=768))
          main_n=count(main); print('FLM-Main-v05 params=',main_n)
          assert 95_000_000 <= main_n <= 110_000_000
          del main; gc.collect()

          coder=ByteCausalLM(TextConfig(seq_len=1024,n_layer=12,n_head=12,n_embd=768))
          coder_n=count(coder); print('FLM-Coder-v05 params=',coder_n)
          assert 80_000_000 <= coder_n <= 95_000_000
          del coder; gc.collect()

          cu=ComputerUseV2(ComputerUseV2Config())
          cu_n=count(cu); print('FLM-ComputerUse-v05 params=',cu_n)
          assert 90_000_000 <= cu_n <= 110_000_000
          del cu; gc.collect()
          PY

      - name: FLM v0.5 dedicated Forza source regression
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('flm/data/prepare_v05.py').read_text(encoding='utf-8')
          assert '"forza_visuals"' in text
          assert '"ILoveCorn/forza-horizon"' in text
          assert '"game:Forza Horizon"' in text
          assert 'def add_forza_visuals' in text
          print('dedicated Forza source wiring OK')
          PY

      - name: FLM v0.5 Kaggle exploded image-shard regression
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from flm.train_v05 import ZipImageStore

          root=Path('/tmp/v05-exploded')
          shard=root/'computer_images_000'
          shard.mkdir(parents=True,exist_ok=True)
          Image.new('RGB',(40,30),'white').save(shard/'sample.jpg')

          store=ZipImageStore(root)
          x=store.image('computer_images_000.zip','sample.jpg',32)
          assert tuple(x.shape)==(3,32,32), x.shape
          print('v0.5 exploded Kaggle image shard OK',tuple(x.shape))
          PY

      - name: FLM v0.5 ComputerUse masked multi-head backward
        run: |
          python - <<'PY'
          import torch
          from flm.models.computer_use_v2 import ComputerUseV2, ComputerUseV2Config
          cfg=ComputerUseV2Config(
              task_len=16,action_len=12,image_size=32,patch=16,
              embd=32,text_layers=1,vision_layers=1,n_head=2,
              num_domains=8,
          )
          m=ComputerUseV2(cfg)
          b=2
          image=torch.randn(b,3,32,32)
          task=torch.randint(0,256,(b,16))
          action=torch.randint(0,256,(b,12))
          target=torch.randint(0,256,(b,12))
          out,loss,parts=m(
              image,task,action,
              op_target=torch.tensor([0,6]),
              op_valid=torch.tensor([1,1],dtype=torch.bool),
              coord_target=torch.tensor([[.3,.4],[0.,0.]]),
              coord_valid=torch.tensor([1,0],dtype=torch.bool),
              bbox_target=torch.tensor([[.1,.1,.5,.5],[0.,0.,0.,0.]]),
              bbox_valid=torch.tensor([1,0],dtype=torch.bool),
              domain_target=torch.tensor([1,2]),
              domain_valid=torch.tensor([1,1],dtype=torch.bool),
              action_target=target,
              action_valid=torch.tensor([1,1],dtype=torch.bool),
          )
          assert loss is not None and torch.isfinite(loss)
          assert set(parts) == {'op','coord','bbox','domain','action'}
          assert out['coord'].shape == (2,2)
          assert out['bbox'].shape == (2,4)
          loss.backward()
          print('v0.5 CU backward OK loss=',float(loss.detach()))
          PY

      - name: Build FLM v0.5 GPU bundle
        run: |
          python scripts/build_kernel_bundle_v05.py --owner test-owner --profile pilot --out /tmp/v05
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads((Path('/tmp/v05')/'kernel-metadata.json').read_text())
          assert m['id']=='test-owner/falcon-flm-v05-pilot-gpu'
          assert m['dataset_sources']==['test-owner/flm-hf-v05']
          assert m['enable_gpu'] is True
          print('v0.5 GPU bundle OK')
          PY

      - name: Main and coder 1-step CPU regression
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_MAIN_SEQ_LEN: "16"
          FLM_MAIN_LAYERS: "1"
          FLM_MAIN_HEADS: "2"
          FLM_MAIN_EMBD: "32"
          FLM_CODER_SEQ_LEN: "16"
          FLM_CODER_LAYERS: "1"
          FLM_CODER_HEADS: "2"
          FLM_CODER_EMBD: "32"
          FLM_BATCH: "2"
          FLM_GRAD_ACCUM: "1"
          FLM_MAIN_STEPS: "1"
          FLM_CODER_STEPS: "1"
        run: |
          mkdir -p /tmp/flm-data
          printf 'Falcon main regression text. %.0s' {1..300} > /tmp/flm-data/main_train.txt
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[
            {'instruction':'Return the sum of two integers.','code':'def add(a,b):\n    return a+b\n'},
            {'instruction':'Compute factorial.','code':'def fact(n):\n    return 1 if n<2 else n*fact(n-1)\n'}
          ]*40
          Path('/tmp/flm-data/coder_train.jsonl').write_text('\n'.join(json.dumps(x) for x in rows))
          PY
          python - <<'PY'
          from pathlib import Path
          from flm.train_text import train_text
          root=Path('/tmp/flm-data'); out=Path('/tmp/flm-out')
          a=train_text('main',root,out)
          b=train_text('coder',root,out)
          assert a['eval_loss']>0 and b['eval_loss']>0
          assert (out/'main/checkpoint.pt').stat().st_size>0
          assert (out/'coder/checkpoint.pt').stat().st_size>0
          print('text train+eval OK')
          PY

      - name: Computer-use vision 1-step CPU regression
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_COMPUTER_STEPS: "1"
          FLM_COMPUTER_BATCH: "1"
          FLM_COMPUTER_IMAGE_SIZE: "32"
          FLM_COMPUTER_EMBD: "32"
          FLM_COMPUTER_HEADS: "2"
          FLM_COMPUTER_TEXT_LAYERS: "1"
          FLM_COMPUTER_VISION_LAYERS: "1"
          FLM_COMPUTER_TASK_LEN: "24"
          FLM_COMPUTER_ACTION_LEN: "24"
        run: |
          python - <<'PY'
          import json,zipfile,io
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('/tmp/cu-data'); root.mkdir(exist_ok=True)
          rows=[]
          with zipfile.ZipFile(root/'computer_images.zip','w',zipfile.ZIP_DEFLATED) as z:
              for i,(op,action) in enumerate([
                  ('CLICK','pyautogui.click(40, 20)'),
                  ('TYPE',"pyautogui.write('hello')"),
                  ('SCROLL','pyautogui.scroll(-3)'),
                  ('KEY',"pyautogui.hotkey('ctrl','l')"),
              ]):
                  im=Image.new('RGB',(64,64),'white')
                  ImageDraw.Draw(im).rectangle((8+i*3,8,32+i*3,30),outline='black')
                  b=io.BytesIO(); im.save(b,'JPEG')
                  name=f'{i}.jpg'; z.writestr(name,b.getvalue())
                  rows.append({'image':name,'task':'Interact with the visible UI','action':action,'operation':op})
          (root/'computer_manifest.jsonl').write_text('\n'.join(json.dumps(x) for x in rows))
          PY
          python - <<'PY'
          from pathlib import Path
          from flm.train_computer_use import train_computer
          result=train_computer(Path('/tmp/cu-data'),Path('/tmp/cu-out'))
          assert result['eval_loss']>0
          assert 0 <= result['op_accuracy'] <= 1
          assert result['vision']['image_size']==32
          assert (Path('/tmp/cu-out/computer_use/checkpoint.pt')).stat().st_size>0
          print('vision computer-use train+eval OK')
          PY
