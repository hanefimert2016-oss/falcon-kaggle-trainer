      - name: FLM v0.5 ComputerUse DataParallel-stable loss keys
        run: |
          python - <<'PY'
          import torch
          from flm.models.computer_use_v2 import ComputerUseV2, ComputerUseV2Config

          cfg=ComputerUseV2Config(
              task_len=16,action_len=12,image_size=32,patch=16,
              embd=32,text_layers=1,vision_layers=1,n_head=4,
              num_domains=8,
          )
          m=ComputerUseV2(cfg)
          def run(mask_on):
              b=1
              img=torch.randn(b,3,32,32)
              task=torch.randint(0,255,(b,16))
              action_in=torch.randint(0,255,(b,12))
              valid=torch.tensor([mask_on],dtype=torch.bool)
              _,loss,parts=m(
                  img,task,action_in,
                  op_target=torch.zeros(b,dtype=torch.long),
                  op_valid=valid,
                  coord_target=torch.zeros(b,2),
                  coord_valid=~valid,
                  bbox_target=torch.zeros(b,4),
                  bbox_valid=valid,
                  domain_target=torch.zeros(b,dtype=torch.long),
                  domain_valid=torch.ones(b,dtype=torch.bool),
                  action_target=torch.zeros(b,12,dtype=torch.long),
                  action_valid=~valid,
              )
              return loss,parts
          l1,p1=run(True)
          l2,p2=run(False)
          expected={'op','coord','bbox','domain','action'}
          assert set(p1)==expected, p1.keys()
          assert set(p2)==expected, p2.keys()
          assert torch.isfinite(l1) and torch.isfinite(l2)
          (l1+l2).backward()
          print('stable ComputerUse loss keys OK',sorted(expected))
          PY

      - name: FLM v0.5 ComputerUse masked multi-head backward
        run: |
          python - <<'PY'
          import torch
          from flm.models.computer_use_v2 import ComputerUseV2, ComputerUseV2Config
          cfg=ComputerUseV2Config(
              task_len=16,action_len=12,image_size=32,patch=16,
              embd=32,text_layers=1,vision_layers=1,n_head=2,
              num_domains=8,
          )
          m=ComputerUseV2(cfg)
          b=2
          image=torch.randn(b,3,32,32)
          task=torch.randint(0,256,(b,16))
          action=torch.randint(0,256,(b,12))
          target=torch.randint(0,256,(b,12))
          out,loss,parts=m(
              image,task,action,
              op_target=torch.tensor([0,6]),
              op_valid=torch.tensor([1,1],dtype=torch.bool),
              coord_target=torch.tensor([[.3,.4],[0.,0.]]),
              coord_valid=torch.tensor([1,0],dtype=torch.bool),
              bbox_target=torch.tensor([[.1,.1,.5,.5],[0.,0.,0.,0.]]),
              bbox_valid=torch.tensor([1,0],dtype=torch.bool),
              domain_target=torch.tensor([1,2]),
              domain_valid=torch.tensor([1,1],dtype=torch.bool),
              action_target=target,
              action_valid=torch.tensor([1,1],dtype=torch.bool),
          )
          assert loss is not None and torch.isfinite(loss)
          assert set(parts) == {'op','coord','bbox','domain','action'}
          assert out['coord'].shape == (2,2)
          assert out['bbox'].shape == (2,4)
          loss.backward()
          print('v0.5 CU backward OK loss=',float(loss.detach()))
          PY

