name: Falcon CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml pillow numpy tokenizers "datasets>=4.0"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Python compile
        run: |
          python -m py_compile             falconctl.py             kaggle/train_flm.py             scripts/colab_setup.py             colab/train_v07_r2.py             scripts/build_kernel_bundle.py             flm/runtime.py             flm/models/text_lm.py             flm/models/core_memory.py             flm/models/interface_transformer.py             flm/core/semantic_ir.py             flm/core/semantic_memory.py             flm/core/semantic_compiler.py             flm/core/reasoning_vm.py             flm/core/planner.py             flm/core/solvers.py             flm/core/verifier.py             flm/core/runtime.py             flm/core/code_engine.py             flm/core/ui_engine.py             flm/core/renderer.py             flm/core_agent.py             flm/interface_agent.py             flm/quality_interface.py             flm/data/semantic_curriculum.py             flm/train_interface_v07.py             scripts/build_core_memory.py             scripts/build_semantic_memory.py             flm/models/computer_use.py             flm/models/computer_use_v2.py             flm/models/computer_use_v3.py             flm/computer_use/action_protocol.py             flm/computer_use/context.py             flm/computer_use/executor.py             flm/tooling/protocol.py             flm/tooling/runtime.py             flm/inference_v07.py             flm/data/prepare_hf.py             flm/data/prepare_v05.py             flm/data/prepare_v06.py             flm/data/prepare_v07.py             flm/data/prepare_v07_text_dev.py             flm/data/prepare_v07_computer_dev.py             scripts/build_v07_dev_computer_cpu_kernel.py             scripts/build_v07_dev_gpu_kernel.py             scripts/eval_semantic_core.py             flm/data/preflight_v05.py             flm/train_v05.py             flm/train_v06.py             flm/train_v07.py             flm/computer_use/agent.py             flm/train_text.py             flm/train_computer_use.py             flm/train_suite.py             run_flm_v06.py             scripts/validate_v06_quality.py             scripts/build_kernel_bundle_v07.py             scripts/validate_v07_quality.py             scripts/run_computer_use_v07.py             scripts/run_flm_v07.py

      - name: Unit tests
        run: pytest -q

      - name: FLM v0.7 local GPU launcher and resume regression
        run: |
          set -euo pipefail
          bash -n train-v07-local.sh
          bash -n scripts/train_v07_local_gpu.sh
          bash -n scripts/monitor_v07_local.sh
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          launcher=Path('scripts/train_v07_local_gpu.sh').read_text()
          assert 'flm.train_interface_v07' in launcher
          assert 'python -u -m flm.train_v07' not in launcher
          assert 'flm-v07-dev-computer' not in launcher
          assert 'flm-v07-semantic-text-r8' in launcher
          from flm.train_v07 import ShuffledStartPool, BalancedSampler

          starts=np.arange(100,dtype=np.int64)
          a=ShuffledStartPool(starts,123)
          a.take(17)
          state=a.state_dict()
          expected=a.take(23)
          b=ShuffledStartPool(starts,999)
          b.load_state_dict(state)
          actual=b.take(23)
          assert np.array_equal(expected,actual)
          assert b.pos==a.pos and b.epoch==a.epoch

          rows=[
              {"operation":"CLICK","id":1},
              {"operation":"KEY","id":2},
              {"operation":"TYPE","id":3},
              {"operation":"SCROLL","id":4},
          ]
          x=BalancedSampler(rows,321)
          for _ in range(5):
              x.sample(3)
          s=x.state_dict()
          expected=[r["id"] for r in x.sample(12)]
          y=BalancedSampler(rows,777)
          y.load_state_dict(s)
          actual=[r["id"] for r in y.sample(12)]
          assert expected==actual

          import torch
          import os
          from flm.models.text_lm import ByteCausalLM, TextConfig
          from flm.train_v07 import training_seq_len
          cfg4k=TextConfig(vocab_size=64,seq_len=4096,n_layer=2,n_head=2,n_embd=32,position_encoding="rope")
          os.environ["FLM_V07_MAIN_TRAIN_SEQ"]="2048"
          assert training_seq_len("main",cfg4k)==2048
          del os.environ["FLM_V07_MAIN_TRAIN_SEQ"]

          tiny=ByteCausalLM(TextConfig(
              vocab_size=64,seq_len=128,n_layer=2,n_head=2,n_embd=32,
              position_encoding="rope",
          ))
          assert tiny.pos is None
          tiny.gradient_checkpointing=True
          tiny.train()
          idx=torch.randint(0,64,(2,128))
          _,loss=tiny(idx,idx)
          loss.backward()
          assert torch.isfinite(loss)

          import tempfile
          from pathlib import Path
          from flm.models.core_memory import CoreMemoryBuilder, CoreMemoryBank
          builder=CoreMemoryBuilder(vocab_size=64,order=4,slots=2048,top_k=2)
          for _ in range(64):
              builder.ingest([1,2,3,4,5])
          bank,meta=builder.build()
          assert meta.accepted_contexts >= 1
          mem_path=Path(tempfile.mkdtemp())/"core_memory.pt"
          bank.save(mem_path,meta=meta.__dict__)
          loaded=CoreMemoryBank.load(mem_path)
          cfg_mem=TextConfig(
              vocab_size=64,seq_len=16,n_layer=1,n_head=2,n_embd=32,
              position_encoding="rope",core_memory=True,
              core_memory_order=4,core_memory_logit_scale=4.0,
              core_memory_residual_scale=0.0,
          )
          mm=ByteCausalLM(cfg_mem).eval()
          q=torch.tensor([[1,2,3,4]],dtype=torch.long)
          with torch.no_grad():
              plain,_=mm(q)
              mm.attach_core_memory(loaded)
              remembered,_=mm(q)
          assert remembered[0,-1,5] > plain[0,-1,5] + 1.0
          assert not any(k.startswith("core_memory.") for k in mm.state_dict())
          print("V07_CORE_MEMORY_ZERO_TRAIN_OK",meta)
          print("V07_LOCAL_RESUME_HELPERS_OK",float(loss))
          PY

      - name: Parse workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in pathlib.Path('.github/workflows').glob('*.yml'):
              data = yaml.safe_load(p.read_text())
              assert isinstance(data, dict) and 'jobs' in data, p
              print('OK', p)
          PY

      - name: Validate Colab notebook JSON
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('colab/Falcon_FLM_Trainer.ipynb')
          nb=json.loads(p.read_text())
          assert nb['nbformat']==4
          print('OK',p,'cells=',len(nb['cells']))
          PY

      - name: Build GPU Kaggle bundle
        run: |
          python scripts/build_kernel_bundle.py --owner test-owner --accelerator NvidiaTeslaT4 --profile fast --out /tmp/kernel_gpu
          python - <<'PY'
          import pathlib,json
          gpu=(pathlib.Path('/tmp/kernel_gpu')/'train_suite.py').read_text()
          assert 'FLM_ACCELERATOR"] = "gpu"' in gpu
          gm=json.loads((pathlib.Path('/tmp/kernel_gpu')/'kernel-metadata.json').read_text())
          assert gm['enable_gpu'] is True
          assert gm['machine_shape']=='NvidiaTeslaT4'
          assert gm['enable_internet'] is False
          print('GPU bundle OK')
          PY

      - name: Kaggle nested mount discovery regression
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from flm import train_suite
          root=Path('/tmp/kaggle-input/nested-dataset-v04')
          root.mkdir(parents=True, exist_ok=True)
          manifest={
            'sources':{
              'main':{'repo':'codelion/fineweb-edu-100M'},
              'coder':{'repo':'Nan-Do/code-search-net-python'},
              'computer_use':{'repo':'markov-ai/computer-use'},
            }
          }
          (root/'sources.json').write_text(json.dumps(manifest))
          old=train_suite.Path
          orig_exists=Path('/kaggle/input').exists()
          os.environ['FLM_DATA_ROOT']=str(root.parent)
          resolved=train_suite.resolve_data_root()
          assert resolved==root.resolve(), (resolved,root)
          print('nested data root discovery OK',resolved)
          PY

      - name: Computer-use mounted image directory regression
        env:
          FLM_ACCELERATOR: cpu
          FLM_SMOKE: "1"
          FLM_COMPUTER_STEPS: "1"
          FLM_COMPUTER_BATCH: "1"
          FLM_COMPUTER_IMAGE_SIZE: "32"
          FLM_COMPUTER_EMBD: "32"
          FLM_COMPUTER_HEADS: "2"
          FLM_COMPUTER_TEXT_LAYERS: "1"
          FLM_COMPUTER_VISION_LAYERS: "1"
          FLM_COMPUTER_TASK_LEN: "24"
          FLM_COMPUTER_ACTION_LEN: "24"
          FLM_COMPUTER_EVAL_BATCHES: "1"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('/tmp/cu-mounted')
          images=root/'computer_images'
          images.mkdir(parents=True,exist_ok=True)
          rows=[]
          for i,(op,action) in enumerate([
              ('CLICK','pyautogui.click(40,20)'),
              ('TYPE',"pyautogui.write('hello')"),
              ('SCROLL','pyautogui.scroll(-3)'),
              ('KEY',"pyautogui.hotkey('ctrl','l')"),
          ]):
              im=Image.new('RGB',(64,64),'white')
              ImageDraw.Draw(im).rectangle((8+i*3,8,32+i*3,30),outline='black')
              name=f'{i}.jpg'
              im.save(images/name)
              rows.append({'image':name,'task':'Interact with visible UI','action':action,'operation':op})
          (root/'computer_manifest.jsonl').write_text('\n'.join(json.dumps(x) for x in rows))
          from flm.train_computer_use import train_computer
          out=Path('/tmp/cu-mounted-out')
          result=train_computer(root,out)
          assert result['eval_loss']>0
          assert (out/'computer_use/checkpoint.pt').stat().st_size>0
          print('mounted image dir regression OK')
          PY

      - name: Semantic FLM strict zero-train architecture regression
        run: |
          set -euo pipefail
          python -m py_compile \
            flm/core/semantic_ir.py \
            flm/core/semantic_memory.py \
            flm/core/semantic_compiler.py \
            flm/core/knowledge_compiler.py \
            flm/core/reasoning_vm.py \
            flm/core/runtime.py \
            flm/core/renderer.py \
            flm/core/code_engine.py \
            flm/core/ui_engine.py \
            flm/core_agent.py \
            flm/data/semantic_curriculum.py \
            scripts/build_v07_tokenizer_kernel.py

          python scripts/build_v07_tokenizer_kernel.py \
            --owner test-owner \
            --dataset flm-v07-semantic-text-r8 \
            --out /tmp/v07-tokenizer-only
          python -m py_compile /tmp/v07-tokenizer-only/train_tokenizer.py

          python - <<'PY'
          import json
          from pathlib import Path

          meta=json.loads(Path('/tmp/v07-tokenizer-only/kernel-metadata.json').read_text())
          assert meta['id']=='test-owner/falcon-flm-v07-tokenizer-only',meta
          assert meta['title']=='Falcon FLM v07 Tokenizer Only',meta
          assert meta['enable_gpu'] is False,meta
          assert meta['dataset_sources']==['test-owner/flm-v07-semantic-text-r8'],meta
          assert meta['model_sources']==[],meta
          wrapper=Path('/tmp/v07-tokenizer-only/train_tokenizer.py').read_text()
          assert 'BpeTrainer' in wrapper
          assert 'torch' not in wrapper
          assert 'InterfaceTransformer' not in wrapper

          from flm.interface_agent import _copy_similarity,_verbatim_requested,_candidate_preserves_core,_has_long_verbatim_overlap
          assert _copy_similarity("aynı veri satırı","aynı veri satırı")>0.99
          assert _copy_similarity("kaynak veri","özgün biçimde üretilmiş cevap")<0.86
          assert _verbatim_requested("Bunu aynen kopyala") is True
          assert _has_long_verbatim_overlap(
              "bu uzun kaynak metin model tarafından doğrudan kopyalanmamalı çünkü cevap özgün olmalı",
              "kaynak metin model tarafından doğrudan kopyalanmamalı çünkü cevap özgün olmalı"
          )
          assert not _has_long_verbatim_overlap(
              "Ada bir kedi ve memelidir",
              "Ada, memeliler sınıfındaki bir kedidir"
          )

          # Authoritative runtime must not require a checkpoint or neural model.
          from flm.core_agent import TrainingFreeAgent
          agent=TrainingFreeAgent()
          assert not hasattr(agent,'model')
          assert not hasattr(agent,'checkpoint')

          from flm.core import Atom,Rule,Query,Program,FLMCore
          core=FLMCore()
          program=Program(
              facts=[
                  Atom('TallerThan',('Ali','Ayse')),
                  Atom('TallerThan',('Ayse','Mehmet')),
              ],
              rules=[Rule(
                  (
                      Atom('TallerThan',('?x','?y')),
                      Atom('TallerThan',('?y','?z')),
                  ),
                  Atom('TallerThan',('?x','?z')),
                  'transitive',
              )],
              queries=[Query(Atom('TallerThan',('Ali','Mehmet')))],
          )
          result=core.execute(program)
          assert result.results[0].answer is True
          assert result.results[0].proof
          print('TRAINING_FREE_REASONING_OK',result.results[0])

          from flm.core.semantic_compiler import SemanticCompiler
          compiler=SemanticCompiler()
          parsed=compiler.compile_canonical('Mert bir bilgisayardır.')
          assert parsed.facts[0].predicate=='IsA'
          assert parsed.facts[0].args==('Mert','Computer')
          parsed_en=compiler.compile_canonical('Mert is a computer.')
          assert parsed_en.facts[0].args==('Mert','Computer')
          rule_prog=compiler.rule_canonical('Her memeli sıcakkanlıdır.')
          assert rule_prog.rules[0].conclusion.predicate=='WarmBlooded'
          math_prog=compiler.operation_canonical('Hesapla: (27+15)*2')
          assert math_prog.operations[0].kind=='ARITHMETIC'
          assert FLMCore().execute(math_prog).operation_results[0]['value']==84
          compare_prog=compiler.operation_canonical('17 mi büyük 9 mu?')
          compare_result=FLMCore().execute(compare_prog).operation_results[0]
          assert compare_result['kind']=='COMPARE_VALUES'
          assert compare_result['relation']=='greater' and compare_result['difference']==8
          sort_prog=compiler.operation_canonical('Şunları küçükten büyüğe sırala: 9, 3, 7, 1.')
          sort_result=FLMCore().execute(sort_prog).operation_results[0]
          assert sort_result['kind']=='SORT_VALUES'
          assert sort_result['sorted']==[1,3,7,9]
          identity_prog=compiler.identity_canonical('Sen kimsin?')
          identity=FLMCore().execute(identity_prog).operation_results[0]
          assert identity['kind']=='IDENTITY' and identity['name']=='FLM'
          working_identity=compiler.identity_canonical('Nasıl çalışıyorsun?')
          assert working_identity.operations[0].kind=='IDENTITY'
          synthesis=Program.from_dict({
              'operations':[{'kind':'SYNTHESIZE_FACTS','args':{'facts':[
                  {'subject':'Ada','predicate':'type','object':'cat'},
                  {'subject':'Ada','predicate':'class','object':'mammal'},
              ]}}],
          })
          synth=FLMCore().execute(synthesis).operation_results[0]
          assert synth['ok'] and len(synth['facts'])==2
          synth_response=FLMCore().execute(synthesis)
          assert _candidate_preserves_core(
              "Ada is a cat and a mammal.","Tell me about Ada",synthesis,synth_response
          )
          assert not _candidate_preserves_core(
              '<|core_result|>{"subject":"Ada"}<|core_end|>',
              "Tell me about Ada",synthesis,synth_response
          )
          assert not _candidate_preserves_core(
              "Ada is a cat.","Tell me about Ada",synthesis,synth_response
          )
          assert not _candidate_preserves_core(
              "Ada bir kedi değildir ve memelidir.","Ada hakkında bilgi ver",
              synthesis,synth_response
          )

          # Regression: CoreResponse.memory_facts is an integer count, so
          # anti-copy inspection must never try to iterate it.
          from flm.interface_agent import _core_source_texts
          assert isinstance(synth_response.memory_facts,int)
          assert isinstance(_core_source_texts(synthesis,synth_response),list)

          # Regression: canonical memory values may be rendered through natural
          # Turkish aliases without being rejected as semantic drift.
          memory_core=FLMCore()
          memory_core.execute(Program.from_dict({
              'facts':[
                  {'predicate':'IsA','args':['Ada','Cat']},
                  {'predicate':'IsA','args':['Ada','Mammal']},
              ]
          }))
          describe=Program.from_dict({
              'operations':[{'kind':'DESCRIBE_ENTITY','args':{'entity':'Ada'}}]
          })
          describe_result=memory_core.execute(describe)
          assert _candidate_preserves_core(
              "Ada memeliler sınıfında yer alan bir kedidir.",
              "Ada hakkında ne biliyorsun?",describe,describe_result
          )
          assert not _candidate_preserves_core(
              "Ada bir kedi değildir.",
              "Ada hakkında ne biliyorsun?",describe,describe_result
          )

          from flm.core.knowledge_compiler import SemanticKnowledgeCompiler
          from flm.core.semantic_memory import SemanticMemory
          kmem=SemanticMemory()
          kcompiler=SemanticKnowledgeCompiler()
          raw_source='Ada bir kedidir.'
          clean_program,fingerprint=kcompiler.compile_record(raw_source)
          assert clean_program.metadata=={}
          assert raw_source not in clean_program.to_json()
          assert len(fingerprint)==64
          stats=kcompiler.ingest(kmem,[raw_source,{'subject':'Ada','predicate':'IsA','object':'Mammal'}])
          assert stats.accepted==2 and stats.facts_added==2,stats
          saved=Path('/tmp/flm-zero-train-memory.json')
          kmem.save(saved)
          memory_text=saved.read_text(encoding='utf-8')
          assert raw_source not in memory_text
          assert 'Ada' in memory_text and 'Cat' in memory_text and 'Mammal' in memory_text

          from flm.core.code_engine import CodeEngine
          graph=CodeEngine().analyze_python('import os\ndef f(x):\n    return print(x)\n')
          assert any(x.name=='f' for x in graph.symbols)
          assert ('f','print') in graph.calls
          java=CodeEngine().analyze_text(
              'import java.util.List;\nclass Demo {\n  static int twice(int x) { return Math.abs(x)*2; }\n}\n',
              'java'
          )
          assert 'java.util.List' in java.imports,java.imports
          assert any(x.name=='Demo' and x.kind=='class' for x in java.symbols),java.symbols
          assert any(x.name=='twice' for x in java.symbols),java.symbols
          assert any(dst=='abs' for _,dst in java.calls),java.calls

          js=CodeEngine().analyze_text(
              'import fs from "fs";\nfunction greet(name) { console.log(name); }\n',
              'javascript'
          )
          assert 'fs' in js.imports,js.imports
          assert any(x.name=='greet' for x in js.symbols),js.symbols
          assert any(dst=='log' for _,dst in js.calls),js.calls

          java_prog=compiler.operation_canonical(
              'Bu Java kodunu analiz et:\n```java\nclass A { int f(){ return g(); } }\n```'
          )
          assert java_prog.operations[0].kind=='ANALYZE_CODE'
          assert java_prog.operations[0].args['language']=='java'

          from flm.core.ui_engine import UIGraph,UIElement,UIPlanner
          ui=UIGraph('editor',[UIElement('save','button','Save',x=.9,y=.1)])
          plan=UIPlanner().plan('Dosyayı kaydet',ui)
          assert plan and plan[0].op=='CLICK' and plan[0].target_id=='save'

          from flm.core import ActionSchema,StatePlanner,ArithmeticSolver,Verifier
          actions=[
              ActionSchema('open',frozenset({'closed'}),frozenset({'open'}),frozenset({'closed'})),
              ActionSchema('save',frozenset({'open'}),frozenset({'saved'})),
          ]
          planned=StatePlanner(actions).plan({'closed'},{'saved'})
          assert planned.found and [x.name for x in planned.actions]==['open','save']
          assert ArithmeticSolver().solve('(27+15)*2')==84
          verified=Verifier().verify([
              ('math',lambda: ArithmeticSolver().solve('2+3')==5),
              ('plan',lambda: planned.found),
          ])
          assert verified.ok

          from flm.data.semantic_curriculum import messages_for,SEMANTIC_MODES,copy_similarity
          from flm.core.semantic_ir import Program
          import re, json
          seen_ops=set()
          language_seen=set()
          for sample in range(SEMANTIC_MODES*2):
              mode=sample%SEMANTIC_MODES
              language='tr' if sample<SEMANTIC_MODES else 'en'
              language_seen.add((mode,language))
              messages=messages_for(sample)
              joined='\n'.join(x['content'] for x in messages)
              user_text=next(x['content'] for x in messages if x['role']=='user')
              final_text=next(x['content'].split('<|final|>',1)[-1].strip() for x in messages if x['role']=='assistant' and '<|final|>' in x['content'])
              if len(final_text)>=18:
                  assert copy_similarity(user_text,final_text)<0.88,(mode,user_text,final_text)
              assert '<|semantic_ir|>' in joined
              assert '<|semantic_end|>' in joined
              assert '<|core_result|>' in joined
              assert '<|final|>' in joined
              assistant=next(x['content'] for x in messages if x['role']=='assistant' and '<|semantic_ir|>' in x['content'])
              prefix='<|semantic_ir|>'; suffix='<|semantic_end|>'
              assert assistant.startswith(prefix) and suffix in assistant,assistant
              raw=assistant.split(prefix,1)[1].split(suffix,1)[0]
              assert raw.strip(),assistant
              program=Program.from_json(raw)
              result=FLMCore().execute(program)
              for op in program.operations:
                  seen_ops.add(op.kind)
              if program.queries:
                  assert result.results
                  # The curriculum deliberately contains both positive and negative queries.
                  assert isinstance(result.results[0].answer,bool)
              for item in result.operation_results:
                  assert isinstance(item.get('ok'),bool),item
              if mode==9:
                  ops=[a['op'] for item in result.operation_results for a in item.get('actions',[])]
                  assert 'TYPE' in ops,ops
          # Same semantic request/Core program, different valid surface answer.
          first=messages_for(13)
          second=messages_for(13+SEMANTIC_MODES*4)
          first_user=next(x['content'] for x in first if x['role']=='user')
          second_user=next(x['content'] for x in second if x['role']=='user')
          first_ir=next(x['content'] for x in first if x['role']=='assistant' and '<|semantic_ir|>' in x['content'])
          second_ir=next(x['content'] for x in second if x['role']=='assistant' and '<|semantic_ir|>' in x['content'])
          first_final=next(x['content'] for x in first if x['role']=='assistant' and '<|final|>' in x['content'])
          second_final=next(x['content'] for x in second if x['role']=='assistant' and '<|final|>' in x['content'])
          # These two are compiler-supervised TR cycles: same request/IR, but a
          # different valid surface answer teaches wording diversity.
          assert first_user==second_user,(first_user,second_user)
          assert first_ir==second_ir,(first_ir,second_ir)
          assert first_final!=second_final,(first_final,second_final)

          # Both TR and EN receive compiler-supervised and source-hidden
          # renderer-only rows; render-only context never exposes raw source wording.
          for mode in range(SEMANTIC_MODES):
              tr_compile=messages_for(mode)
              en_compile=messages_for(SEMANTIC_MODES+mode)
              tr_render=messages_for(SEMANTIC_MODES*2+mode)
              en_render=messages_for(SEMANTIC_MODES*3+mode)
              assert tr_compile[2].get('train') is True,(mode,tr_compile)
              assert en_compile[2].get('train') is True,(mode,en_compile)
              assert tr_render[2].get('train') is False,(mode,tr_render)
              assert en_render[2].get('train') is False,(mode,en_render)
