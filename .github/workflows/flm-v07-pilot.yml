name: FLM v0.7 GPU Pilot

on:
  workflow_run:
    workflows:
      - FLM v0.7 Data CPU
    types:
      - completed
  push:
    paths:
      - '.flm-v07-pilot-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-pilot-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Verify native v0.7 dataset
        run: |
          set -euo pipefail
          mkdir -p /tmp/v07verify
          kaggle datasets download "$KAGGLE_OWNER/flm-hf-v07" -f sources.json -p /tmp/v07verify --unzip
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('/tmp/v07verify').rglob('sources.json'))
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['pipeline_version']=='v0.7'
          s=x['stats']
          assert s['main']['tokens'] >= 280_000_000
          assert s['coder']['tokens'] >= 78_000_000
          assert s['main_sft']['rows'] >= 220_000
          assert s['coder_sft']['rows'] >= 118_000
          assert s['computer_rexx']['examples'] >= 1500
          print('V07_NATIVE_DATASET_VERIFIED',p)
          PY
      - name: Build production-shape pilot
        run: |
          set -euo pipefail
          python scripts/build_kernel_bundle_v07.py --owner "$KAGGLE_OWNER" --profile pilot --out kernel_v07
          python -m py_compile kernel_v07/train_v07.py
          cat kernel_v07/kernel-metadata.json
      - name: Submit pilot to 2xT4
        run: |
          set -euo pipefail
          OUTPUT="$(kaggle kernels push -p kernel_v07 --accelerator NvidiaTeslaT4 --timeout 7200 2>&1 || true)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q 'successfully pushed'
      - name: Wait for pilot completion
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -q 'KernelWorkerStatus.COMPLETE'; then
              kaggle kernels logs "$REF" > /tmp/pilot.log
              cat /tmp/pilot.log
              grep -q 'V07_SUITE_COMPLETE' /tmp/pilot.log
              ! grep -q 'non-finite' /tmp/pilot.log
              exit 0
            fi
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(ERROR|FAILED|CANCELLED)'; then
              kaggle kernels logs "$REF" || true
              exit 1
            fi
            sleep 12
          done
          echo "pilot timed out waiting for Kaggle"
          kaggle kernels logs "$REF" || true
          exit 1
