name: LingBot low-VRAM TPU smoke syntax

on:
  push:
    branches: [lingbot-world-v2-tpu-v0.1]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: |
          python -m py_compile             lingbot-world-v2-lowvram-tpu/lingbot_accel/runtime.py             lingbot-world-v2-lowvram-tpu/scripts/bench_dit.py             lingbot-world-v2-lowvram-tpu/kaggle/tpu_v5e_smoke.py
