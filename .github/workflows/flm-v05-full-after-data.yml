name: FLM v0.5 Full GPU After Expanded Data

on:
  workflow_run:
    workflows:
      - "FLM v0.5 Expanded Data CPU Prep"
    types:
      - completed

permissions:
  contents: read

jobs:
  launch-full:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v05-full-gpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"

      - name: Verify expanded v0.5 dataset is published
        run: |
          set -euo pipefail
          kaggle datasets files "$KAGGLE_OWNER/flm-hf-v05" --page-size 100 | tee /tmp/files.txt
          grep -q 'main_train.bin' /tmp/files.txt
          grep -q 'coder_train.bin' /tmp/files.txt
          grep -q 'computer_manifest.jsonl' /tmp/files.txt

      - name: Build full 100M-class trio
        run: |
          python scripts/build_kernel_bundle_v05.py             --owner "$KAGGLE_OWNER"             --profile full             --out kernel_v05_full
          cat kernel_v05_full/kernel-metadata.json

      - name: Submit full training to 2xT4
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 6); do
            OUTPUT="$(kaggle kernels push -p kernel_v05_full --accelerator NvidiaTeslaT4 --timeout 43200 2>&1 || true)"
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q 'successfully pushed'; then
              ok=1
              break
            fi
            if echo "$OUTPUT" | grep -qi 'Maximum batch GPU session count'; then
              echo "GPU slot busy; retry $attempt/6"
              sleep 30
              continue
            fi
            echo "Kaggle push failed"
            exit 1
          done
          test "$ok" = "1"

      - name: Verify full session exists
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(QUEUED|RUNNING|COMPLETE)'; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" = "1"
