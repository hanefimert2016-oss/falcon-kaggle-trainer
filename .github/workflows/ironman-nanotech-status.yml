name: Iron Man Nanotech Live Status
on:
  push:
    paths:
      - '.ironman-live-status-trigger'
      - '.github/workflows/ironman-nanotech-status.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/ironman-nanotech-3d
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Status
        run: |
          kaggle kernels status "$REF"
      - name: Live logs
        if: always()
        run: kaggle kernels logs "$REF" || true
