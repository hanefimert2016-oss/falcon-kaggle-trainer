name: FLM v0.7 DEV Text Repair

on:
  push:
    paths:
      - '.hf-v07-dev-text-repair-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flm-v07-semantic-text-r6
  cancel-in-progress: true

jobs:
  text-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU data stack
        run: python -m pip install "datasets>=4.0" "huggingface_hub>=0.30" "tokenizers>=0.20" "kaggle>=2.2.1" numpy pillow

      - name: Import smoke test
        run: |
          set -euo pipefail
          test -z "$CUDA_VISIBLE_DEVICES"
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import flm.data.prepare_v07
          import flm.data.prepare_v07_text_dev
          from flm.data.prepare_v07 import copy_prefix

          # Regression: cut deliberately inside the two-byte UTF-8 encoding of ş.
          root=Path(tempfile.mkdtemp(prefix="v07-utf8-"))
          src=root/"src.txt"
          dst=root/"dst.txt"
          src.write_bytes((b"A"*63) + "ş".encode("utf-8") + (b"B"*100))
          copy_prefix(src,dst,64)
          text=dst.read_text(encoding="utf-8")
          assert text and "\ufffd" not in text
          print("V07_UTF8_PREFIX_OK",len(dst.read_bytes()),repr(text[-8:]))
          print("V07_DEV_TEXT_IMPORT_OK")
          PY
          python -m py_compile flm/data/prepare_v07_text_dev.py

      - name: Build massive Main Coder Tool data on GitHub CPU
        run: |
          set -euo pipefail
          test -z "$CUDA_VISIBLE_DEVICES"
          python -m flm.data.prepare_v07_text_dev \
            --out prepared_v07_dev_text \
            --owner "$KAGGLE_OWNER" \
            --main-bytes 3072000000 \
            --wiki-tr-bytes 768000000 \
            --wiki-en-bytes 768000000 \
            --coder-bytes 768000000 \
            --vocab-size 32768 \
            --en-sft-rows 300000 \
            --tr-knowledge-rows 320000 \
            --coder-code-rows 250000 \
            --xlam-tool-rows 100000 \
            --tool100k-rows 100000 \
            --coder-agent-rows 6000 \
            --semantic-sft-rows 1000000

      - name: Verify massive text scale
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('prepared_v07_dev_text/sources.json')
          x=json.loads(p.read_text())
          assert x['pipeline_version']=='v0.7-dev-text'
          assert int(x.get('data_revision',0)) >= 6, x.get('data_revision')
          s=x['stats']
          assert s['main_raw']['bytes'] >= 3_000_000_000, s['main_raw']
          assert s['main_raw']['bytes_total_with_knowledge'] >= 4_400_000_000, s['main_raw']
          assert s['main_wiki_tr']['bytes'] >= 700_000_000, s['main_wiki_tr']
          assert s['main_wiki_en']['bytes'] >= 700_000_000, s['main_wiki_en']
          assert s['coder_raw']['content_bytes'] >= 730_000_000, s['coder_raw']
          assert s['main']['tokens'] >= 1_000_000_000, s['main']
          assert s['coder']['tokens'] >= 190_000_000, s['coder']
          assert s['main_sft_raw']['rows'] >= 550_000, s['main_sft_raw']
          sem=s['semantic_interface_sft']
          assert sem['rows'] >= 1_000_000, sem
          assert sem.get('anti_copy_verified') is True, sem
          assert int(sem.get('anti_copy_phrase_words',0))==9, sem
          assert sem.get('source')=='synthetic:flm-semantic-curriculum-v4', sem
          assert int(sem.get('render_focused_rows',0)) >= 330_000, sem
          assert sem.get('ir_supervision_policy') == '2/3 compiler+render, 1/3 render-only', sem
          assert s['semantic_sft']['supervised_tokens'] >= 140_000_000, s['semantic_sft']
          langs=sem.get('language_counts') or {}
          assert int(langs.get('tr',0)) >= 490_000, langs
          assert int(langs.get('en',0)) >= 490_000, langs
          modes=sem.get('mode_counts') or {}
          assert len(modes) >= 16 and min(map(int,modes.values())) >= 62_000, modes
          assert s['main_sft']['supervised_tokens'] >= 350_000_000, s['main_sft']
          assert s['coder_sft_raw']['rows'] >= 280_000, s['coder_sft_raw']
          assert s['coder_sft_tool100k']['rows'] >= 85000, s['coder_sft_tool100k']
          assert s['coder_sft_agentic']['rows'] >= 6000, s['coder_sft_agentic']
          assert s['coder_sft_agentic']['real_rows'] >= 3800, s['coder_sft_agentic']
          assert s['coder_sft_agentic']['synthetic_rows'] >= 1500, s['coder_sft_agentic']
          assert s['coder_sft_agentic']['plan_turns'] >= 12000, s['coder_sft_agentic']
          assert s['coder_sft']['supervised_tokens'] >= 75_000_000, s['coder_sft']
          assert s['tokenizer']['vocab_size'] >= 30000
          special=s['tokenizer']['special_ids']
          for token in ('<|semantic_ir|>','<|semantic_end|>','<|core_result|>','<|core_end|>'):
              assert special.get(token) is not None,(token,special)
          print('V07_DEV_TEXT_VERIFIED')
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY
          du -sh prepared_v07_dev_text

      - name: Upload private DEV text dataset
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/flm-v07-semantic-text-r6"
          if kaggle datasets list --mine -s flm-v07-semantic-text-r6 -v | grep -Fq "$REF"; then
            kaggle datasets version -p prepared_v07_dev_text -m "FLM v0.7 r6 dedicated semantic synthesis data" -q -t -r skip
          else
            kaggle datasets create -p prepared_v07_dev_text -q -t -r skip
          fi
          for attempt in $(seq 1 120); do
            if kaggle datasets files "$REF" --page-size 30; then
              echo "V07_DEV_TEXT_KAGGLE_READY"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: flm-v07-semantic-text-r6-manifest-repaired
          path: |
            prepared_v07_dev_text/sources.json
            prepared_v07_dev_text/tokenizer_meta.json
          retention-days: 14
