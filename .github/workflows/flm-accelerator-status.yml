name: FLM Accelerator Status Probe

on:
  push:
    paths:
      - '.flm-accelerator-status-trigger'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: GPU kernel
        run: |
          kaggle kernels status "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite" || true
      - name: TPU kernel
        run: |
          kaggle kernels status "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite-tpu" ||           kaggle kernels status "$KAGGLE_OWNER/falcon-flm-v04-three-model-tpu-smoke" || true
      - name: Quota
        run: kaggle quota
