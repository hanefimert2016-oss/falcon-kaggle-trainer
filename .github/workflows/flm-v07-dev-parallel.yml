name: FLM v0.7 GitHub Computer Data

on:
  push:
    paths:
      - '.hf-v07-dev-trigger'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Rebuild ComputerUse data on GitHub CPU instead of reusing prepared data'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flm-v07-github-computer-data
  cancel-in-progress: false

jobs:
  computer-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      HF_HUB_ETAG_TIMEOUT: "45"
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      TARGET_REF: ${{ vars.KAGGLE_OWNER }}/flm-v07-dev-computer
      LEGACY_REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-dev-computer-cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GitHub CPU data stack
        run: |
          python -m pip install \
            "datasets>=4.0,<5" \
            "huggingface_hub>=0.30,<2" \
            "tokenizers>=0.20" \
            "pillow>=10" \
            "numpy>=1.26" \
            "kaggle>=2.2.1"

      - name: Check existing prepared ComputerUse dataset
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v07-existing
          mkdir -p /tmp/v07-existing
          ready=false

          for attempt in $(seq 1 24); do
            rm -rf /tmp/v07-existing/*
            if kaggle datasets download -d "$TARGET_REF" -f sources.json -p /tmp/v07-existing -q --force 2>/tmp/v07-existing.err; then
              if python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v07-existing/sources.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x.get('pipeline_version') == 'v0.7-dev-computer'
          s=x.get('stats') or {}
          assert int(s.get('examples',0)) >= 30000
          assert int((s.get('ops') or {}).get('CLICK',0)) >= 20000
          assert int((s.get('ops') or {}).get('KEY',0)) >= 100
          assert int((s.get('ops') or {}).get('TYPE',0)) >= 10
          print('EXISTING_COMPUTER_DATASET_METADATA_VALID',s.get('examples'),s.get('ops'))
          PY
              then
                if kaggle datasets download -d "$TARGET_REF" -f cu07_manifest.jsonl -p /tmp/v07-existing -q --force 2>/tmp/v07-manifest.err; then
                  test -s /tmp/v07-existing/cu07_manifest.jsonl
                  ready=true
                  break
                fi
              fi
            fi
            sleep 5
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" == "true" ]]; then
            echo "V07_EXISTING_COMPUTER_DATASET_READY"
          else
            cat /tmp/v07-existing.err 2>/dev/null || true
            cat /tmp/v07-manifest.err 2>/dev/null || true
            echo "V07_EXISTING_COMPUTER_DATASET_NOT_READY"
          fi

      - name: Reuse existing prepared data or build on GitHub CPU
        if: steps.existing.outputs.ready != 'true'
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prepared_v07_dev_computer legacy_v07_computer

          REBUILD="${{ github.event.inputs.rebuild || 'false' }}"

          # Fast migration path: reuse the already-finished legacy CPU output once.
          # This does not execute a Kaggle CPU kernel. New/rebuilt data is always
          # generated directly on this GitHub Actions runner.
          if [[ "$REBUILD" != "true" ]]; then
            mkdir -p legacy_v07_computer
            if kaggle kernels output "$LEGACY_REF" -p legacy_v07_computer -q 2>/tmp/legacy.err; then
              ROOT="$(find legacy_v07_computer -type f -name sources.json -print -quit | xargs -r dirname || true)"
              if [[ -n "$ROOT" ]] && python - "$ROOT/sources.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          x=json.load(open(p,encoding='utf-8'))
          assert x.get('pipeline_version')=='v0.7-dev-computer',x.get('pipeline_version')
          assert int((x.get('stats') or {}).get('examples',0)) >= 30000
          print('LEGACY_PREPARED_DATA_VALID')
          PY
              then
                cp -a "$ROOT" prepared_v07_dev_computer
                echo "source=migrated-prepared-output" >> "$GITHUB_OUTPUT"
              fi
            else
              cat /tmp/legacy.err || true
            fi
          fi

          if [[ ! -f prepared_v07_dev_computer/sources.json ]]; then
            echo "Building ComputerUse data on GitHub Actions CPU"
            python -m flm.data.prepare_v07_computer_dev \
              --out prepared_v07_dev_computer \
              --owner "$KAGGLE_OWNER" \
              --rexx-trajectories 5000 \
              --groundcua 8000 \
              --salesforce 18000 \
              --showui 7496 \
              --click100k-max 6000 \
              --min-rows 30000
            echo "source=github-actions-cpu" >> "$GITHUB_OUTPUT"
          fi

          python - "$KAGGLE_OWNER" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path('prepared_v07_dev_computer')
          owner=sys.argv[1]
          x=json.loads((root/'sources.json').read_text(encoding='utf-8'))
          assert x['pipeline_version']=='v0.7-dev-computer'
          s=x['stats']
          assert s['examples'] >= 30000,s
          assert s['ops'].get('CLICK',0) >= 20000,s['ops']
          assert s['ops'].get('KEY',0) >= 100,s['ops']
          assert s['ops'].get('TYPE',0) >= 10,s['ops']
          meta={
            'title':'FLM v07 DEV Computer',
            'id':f'{owner}/flm-v07-dev-computer',
            'licenses':[{'name':'other'}],
            'description':'FLM v0.7 ComputerUse data prepared/orchestrated by GitHub Actions CPU.'
          }
          (root/'dataset-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          print('V07_GITHUB_COMPUTER_DATA_VERIFIED',s['examples'],s['ops'])
          PY
          du -sh prepared_v07_dev_computer
          df -h .

      - name: Publish prepared ComputerUse dataset
        if: steps.existing.outputs.ready != 'true'
        run: |
          set -euo pipefail
          if kaggle datasets files "$TARGET_REF" --page-size 100 >/tmp/existing.txt 2>&1; then
            kaggle datasets version \
              -p prepared_v07_dev_computer \
              -m "FLM v0.7 ComputerUse data from GitHub Actions CPU" \
              -q -t -r skip
          else
            kaggle datasets create \
              -p prepared_v07_dev_computer \
              -q -t -r skip
          fi

          rm -rf /tmp/v07-published
          mkdir -p /tmp/v07-published
          for attempt in $(seq 1 180); do
            rm -rf /tmp/v07-published/*
            if kaggle datasets download -d "$TARGET_REF" -f sources.json -p /tmp/v07-published -q --force 2>/tmp/publish-meta.err               && kaggle datasets download -d "$TARGET_REF" -f cu07_manifest.jsonl -p /tmp/v07-published -q --force 2>/tmp/publish-manifest.err; then
              python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/v07-published')
          x=json.loads((root/'sources.json').read_text(encoding='utf-8'))
          assert x.get('pipeline_version')=='v0.7-dev-computer'
          s=x.get('stats') or {}
          assert int(s.get('examples',0)) >= 30000
          assert (root/'cu07_manifest.jsonl').stat().st_size > 1000
          print('V07_GITHUB_COMPUTER_DATA_READY',s.get('examples'),s.get('ops'))
          PY
              exit 0
            fi
            sleep 5
          done
          cat /tmp/publish-meta.err 2>/dev/null || true
          cat /tmp/publish-manifest.err 2>/dev/null || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.ready != 'true'
        with:
          name: flm-v07-github-computer-manifest
          path: |
            prepared_v07_dev_computer/sources.json
            prepared_v07_dev_computer/progress.json
            prepared_v07_dev_computer/dataset-metadata.json
          retention-days: 14
