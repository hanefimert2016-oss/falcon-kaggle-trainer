name: FLM v0.7 DEV Parallel Data

on:
  push:
    paths:
      - '.hf-v07-dev-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  computer-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-dev-computer-cpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Build Kaggle CPU data kernel
        run: |
          set -euo pipefail
          python scripts/build_v07_dev_computer_cpu_kernel.py --owner "$KAGGLE_OWNER" --out kernel_v07_dev_cpu
          python -m py_compile kernel_v07_dev_cpu/prepare_computer.py
          cat kernel_v07_dev_cpu/kernel-metadata.json
      - name: Submit ComputerUse data build to Kaggle CPU
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 6); do
            OUTPUT="$(kaggle kernels push -p kernel_v07_dev_cpu --timeout 21600 2>&1 || true)"
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q 'successfully pushed'; then
              ok=1
              break
            fi
            if echo "$OUTPUT" | grep -Eqi '429|rate.?limit|temporar|timeout|timed out|connection|502|503|504'; then
              sleep $((attempt * 20))
              continue
            fi
            break
          done
          test "$ok" = "1"
      - name: Wait for Kaggle CPU data
        run: |
          set -euo pipefail
          for attempt in $(seq 1 1000); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?COMPLETE'; then
              kaggle kernels logs "$REF" > /tmp/cu.log
              tail -n 300 /tmp/cu.log
              grep -q 'V07_DEV_COMPUTER_COMPLETE' /tmp/cu.log
              exit 0
            fi
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(ERROR|FAILED|CANCELLED)'; then
              echo "Kaggle ComputerUse kernel failed; dumping diagnostic log"
              kaggle kernels logs "$REF" > /tmp/cu.log 2>&1 || true
              tail -n 500 /tmp/cu.log || true
              exit 1
            fi
            sleep 20
          done
          echo "Kaggle CPU data timeout"
          kaggle kernels logs "$REF" > /tmp/cu.log 2>&1 || true
          tail -n 500 /tmp/cu.log || true
          exit 1
