name: FLM v0.4 Kaggle Status

on:
  push:
    paths:
      - '.flm-v04-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Kernel status
        run: kaggle kernels status "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite"
      - name: Kernel logs
        run: kaggle kernels logs "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite" || true
      - name: Quota
        run: kaggle quota
