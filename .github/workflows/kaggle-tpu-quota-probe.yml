name: Kaggle TPU Quota Probe

on:
  push:
    branches:
      - lingbot-tpu-v5e-port
    paths:
      - '.kaggle-tpu-quota-trigger'

permissions:
  contents: read

jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1" kagglesdk
      - name: Read accelerator quota
        run: |
          python - <<'PY'
          import json
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetAcceleratorQuotaStatisticsRequest
          api=KaggleApi(); api.authenticate()
          with api.build_kaggle_client() as client:
              q=client.kernels.kernels_api_client.get_accelerator_quota_statistics(
                  ApiGetAcceleratorQuotaStatisticsRequest())
          def d(x):
              if x is None: return None
              keys=[k for k in dir(x) if not k.startswith('_') and k not in ('endpoint','endpoint_path')]
              out={}
              for k in keys:
                  try:
                      v=getattr(x,k)
                      if callable(v): continue
                      out[k]=str(v)
                  except Exception: pass
              return out
          print("QUOTA_REFRESH", q.quota_refresh_time)
          print("TPU_QUOTA", json.dumps(d(q.tpu_quota),indent=2,sort_keys=True))
          print("GPU_QUOTA", json.dumps(d(q.gpu_quota),indent=2,sort_keys=True))
          PY
