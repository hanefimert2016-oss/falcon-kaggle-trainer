name: Iron Man Nanotech 3D - Kaggle GPU

on:
  push:
    paths:
      - 'gpu_jobs/ironman_nanotech/**'
      - '.github/workflows/ironman-nanotech-kaggle.yml'
      - '.ironman-nanotech-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ironman-nanotech-kaggle
  cancel-in-progress: true

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/ironman-nanotech-3d
      RELEASE_TAG: ironman-nanotech-hq-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Kaggle credentials
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing KAGGLE_API_TOKEN secret" && exit 1)
          test -n "$KAGGLE_OWNER" || (echo "Missing KAGGLE_OWNER variable" && exit 1)

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade "kaggle>=2.2.1"

      - name: Build and validate GPU kernel
        run: |
          set -euo pipefail
          python -m py_compile gpu_jobs/ironman_nanotech/blender_scene.py
          python -m py_compile gpu_jobs/ironman_nanotech/blender_scene_hq.py
          python -m py_compile gpu_jobs/ironman_nanotech/build_kaggle_kernel.py
          python gpu_jobs/ironman_nanotech/build_kaggle_kernel.py --owner "$KAGGLE_OWNER" --out kernel_ironman_nanotech
          python -m py_compile kernel_ironman_nanotech/kernel.py
          cat kernel_ironman_nanotech/kernel-metadata.json

      - name: Submit to Kaggle T4 GPU
        run: |
          set -uo pipefail
          # Recreate only this generated Iron Man kernel so an obsolete render
          # cannot keep one of the account's two batch-GPU session slots occupied.
          kaggle kernels delete "$REF" -y >/tmp/ironman_delete.log 2>&1 || true
          cat /tmp/ironman_delete.log || true
          sleep 3
          set +e
          OUT="$(kaggle kernels push -p kernel_ironman_nanotech --accelerator NvidiaTeslaT4 --timeout 7200 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -qi "Kernel push error"; then exit 1; fi
          exit "$RC"

      - name: Wait for render
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "[$attempt] $STATUS"
            if echo "$STATUS" | grep -q "KernelWorkerStatus.COMPLETE"; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eq "KernelWorkerStatus.(ERROR|CANCELLED)"; then
              kaggle kernels logs "$REF" || true
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for Kaggle render"
          kaggle kernels logs "$REF" || true
          exit 1

      - name: Download generated 3D assets
        run: |
          set -euo pipefail
          mkdir -p outputs/ironman_nanotech
          kaggle kernels output "$REF" -p outputs/ironman_nanotech -o
          find outputs/ironman_nanotech -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          test -s outputs/ironman_nanotech/ironman_nanotech_hq_scene.blend
          test -s outputs/ironman_nanotech/ironman_nanotech_hq_animated.glb
          test -s outputs/ironman_nanotech/ironman_nanotech_hq_poster.png

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironman-nanotech-3d
          path: outputs/ironman_nanotech/
          if-no-files-found: error
          retention-days: 14

      - name: Publish generated assets as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$RELEASE_TAG" outputs/ironman_nanotech/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Iron Man Nanotech 3D HQ v2 - Kaggle T4" \
            --notes "Procedurally generated Blender scene, animated GLB and verification poster. The GLB contains the full 168-frame HQ nanotech transformation. Generated by the Kaggle GPU workflow."

      - name: Record verifiable completion status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('outputs/ironman_nanotech')
          files={p.name:p.stat().st_size for p in root.iterdir() if p.is_file()}
          status={
              'state':'complete',
              'kaggle_kernel':os.environ['REF'],
              'release_tag':os.environ['RELEASE_TAG'],
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'source_commit':os.environ.get('GITHUB_SHA'),
              'files':files,
          }
          pathlib.Path('.ironman-nanotech-status.json').write_text(json.dumps(status,indent=2)+'\n')
          print(json.dumps(status,indent=2))
          PY
          echo "Completion status recorded in workflow log; release assets are the source of truth."
          cat .ironman-nanotech-status.json
