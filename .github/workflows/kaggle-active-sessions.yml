name: Kaggle Active FLM Sessions

on:
  push:
    paths:
      - '.kaggle-session-probe'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Enumerate all owned kernels and statuses
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --mine -v --page-size 100 > /tmp/kernels.csv
          cat /tmp/kernels.csv
          python - <<'PY' > /tmp/kernel_refs.txt
          import csv
          from pathlib import Path

          rows = list(csv.reader(Path("/tmp/kernels.csv").read_text(encoding="utf-8").splitlines()))
          if not rows:
              raise SystemExit(0)
          header = [cell.strip().lower() for cell in rows[0]]
          try:
              ref_idx = header.index("ref")
          except ValueError:
              ref_idx = 0
          seen = set()
          for row in rows[1:]:
              if len(row) <= ref_idx:
                  continue
              ref = row[ref_idx].strip()
              if "/" not in ref or ref in seen:
                  continue
              seen.add(ref)
              print(ref)
          PY

          echo '=== per-kernel status ==='
          while IFS= read -r REF; do
            [[ -n "$REF" ]] || continue
            echo "=== $REF ==="
            kaggle kernels status "$REF" || true
          done < /tmp/kernel_refs.txt

      - name: Quota
        run: kaggle quota
