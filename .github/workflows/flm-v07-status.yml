name: FLM v0.7 Full Status and Fetch

on:
  push:
    paths:
      - '.flm-v07-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-full-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Read state
        id: state
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
          echo "$STATUS"
          if echo "$STATUS" | grep -q 'KernelWorkerStatus.COMPLETE'; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          elif echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(ERROR|FAILED|CANCELLED)'; then
            echo "state=failed" >> "$GITHUB_OUTPUT"
          elif echo "$STATUS" | grep -q 'KernelWorkerStatus.RUNNING'; then
            echo "state=running" >> "$GITHUB_OUTPUT"
          else
            echo "state=queued" >> "$GITHUB_OUTPUT"
          fi
      - name: Show logs
        run: kaggle kernels logs "$REF" 2>&1 | tail -n 500 || true
      - name: Fail on Kaggle error
        if: steps.state.outputs.state == 'failed'
        run: exit 1
      - name: Download completed outputs
        if: steps.state.outputs.state == 'complete'
        run: |
          set -euo pipefail
          mkdir -p full_out
          kaggle kernels output "$REF" -p full_out -o
          ROOT="$(find full_out -type f -name suite_metrics.json -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "$ROOT" > /tmp/v07-root.txt
          for M in main coder computer_use; do
            test -s "$ROOT/$M/checkpoint.pt"
          done
          python scripts/validate_v07_quality.py "$ROOT"
          find "$ROOT" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Create final ZIP
        if: steps.state.outputs.state == 'complete'
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/v07-root.txt)"
          cd "$(dirname "$ROOT")"
          zip -r -0 "$GITHUB_WORKSPACE/FLM-v0.7-FULL-FINAL.zip" "$(basename "$ROOT")"
          cd "$GITHUB_WORKSPACE"
          ls -lh FLM-v0.7-FULL-FINAL.zip
      - uses: actions/upload-artifact@v4
        if: steps.state.outputs.state == 'complete'
        with:
          name: FLM-v0.7-FULL-FINAL
          path: FLM-v0.7-FULL-FINAL.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
