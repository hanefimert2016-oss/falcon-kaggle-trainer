name: LingBot TPU Interactive Status

on:
  push:
    branches:
      - lingbot-tpu-v5e-port
    paths:
      - '.lingbot-tpu-interactive-status-trigger'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: lingbot-world-v2-interactive-tpu-v2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1"
      - name: Status and logs
        run: |
          set -x
          kaggle kernels list --user "$KAGGLE_OWNER" --search lingbot --page-size 50 || true
          kaggle kernels status "$KAGGLE_OWNER/$KERNEL_SLUG" || true
          echo "=== KAGGLE LOGS ==="
          kaggle kernels logs "$KAGGLE_OWNER/$KERNEL_SLUG" || true
          echo "=== KAGGLE OUTPUT ==="
          mkdir -p /tmp/lingbot-output
          kaggle kernels output "$KAGGLE_OWNER/$KERNEL_SLUG" -p /tmp/lingbot-output -o || true
          find /tmp/lingbot-output -maxdepth 3 -type f -printf '%p %s bytes\n' || true
          test ! -f /tmp/lingbot-output/lingbot_tpu_benchmark.log || cat /tmp/lingbot-output/lingbot_tpu_benchmark.log
