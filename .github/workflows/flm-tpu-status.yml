name: FLM TPU Status

on:
  push:
    paths:
      - '.flm-tpu-status-trigger'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Resolve and query TPU kernel
        run: |
          set -euo pipefail
          found=0
          for REF in             "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite-tpu"             "$KAGGLE_OWNER/falcon-flm-v04-three-model-tpu-smoke"; do
            if STATUS="$(kaggle kernels status "$REF" 2>&1)"; then
              echo "TPU_REF=$REF"
              echo "$STATUS"
              kaggle kernels logs "$REF" || true
              found=1
              break
            else
              echo "not-accessible: $REF"
            fi
          done
          test "$found" = "1"
      - name: Quota
        run: kaggle quota
