name: FLM Three Model GPU Train

on:
  push:
    paths:
      - '.flm-train-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      ACCELERATOR: NvidiaTeslaT4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"

      - name: Verify CPU-prepared Hugging Face dataset exists
        run: kaggle datasets files "$KAGGLE_OWNER/flm-hf-v04" --page-size 20

      - name: Build 2xT4 three-model kernel
        run: |
          python scripts/build_kernel_bundle.py \
            --owner "$KAGGLE_OWNER" \
            --accelerator "$ACCELERATOR" \
            --out kernel_bundle
          python - <<'PY'
          import json
          m=json.load(open('kernel_bundle/kernel-metadata.json'))
          print(json.dumps(m,indent=2))
          assert m['enable_gpu'] is True
          assert m['machine_shape']=='NvidiaTeslaT4'
          assert m['enable_internet'] is False
          assert m['dataset_sources']
          PY

      - name: Train and evaluate all three models on GPU
        run: |
          kaggle kernels push \
            -p kernel_bundle \
            --accelerator "$ACCELERATOR" \
            --timeout 43200
