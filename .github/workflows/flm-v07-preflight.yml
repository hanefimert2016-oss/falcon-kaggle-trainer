name: FLM v0.7 Data Schema Preflight

on:
  push:
    paths:
      - '.flm-v07-preflight-trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "datasets>=4.0" pillow
      - name: Inspect real source schemas
        run: |
          python - <<'PY'
          from datasets import load_dataset
          import json

          def shrink(v):
              if hasattr(v,'size') and hasattr(v,'mode'):
                  return {'image_size':getattr(v,'size',None),'mode':getattr(v,'mode',None)}
              if isinstance(v,list):
                  return [shrink(x) for x in v[:2]]
              if isinstance(v,dict):
                  return {str(k):shrink(x) for k,x in list(v.items())[:12]}
              s=str(v)
              return s[:600]

          targets=[
              ('xlam','product-science/xlam-function-calling-60k-raw',None),
              ('oasst1','OpenAssistant/oasst1',None),
              ('rexx','REXX-NEW/computer-use',None),
              ('unigui','UI-MOPD/Uni-GUI-Desktop-1',None),
          ]
          for name,repo,config in targets:
              print('===',name,repo,'===')
              try:
                  kw={'split':'train','streaming':True}
                  if config:
                      ds=load_dataset(repo,config,**kw)
                  else:
                      ds=load_dataset(repo,**kw)
                  row=next(iter(ds))
                  print('FEATURES',ds.features)
                  print('KEYS',sorted(row))
                  print('ROW',json.dumps({k:shrink(v) for k,v in row.items()},ensure_ascii=False,default=str)[:12000])
              except Exception as e:
                  print('ERROR',name,type(e).__name__,str(e))
          PY
