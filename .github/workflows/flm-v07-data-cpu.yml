name: FLM v0.7 Data CPU

on:
  push:
    paths:
      - '.hf-v07-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove CPU-only phase
        run: |
          test -z "$CUDA_VISIBLE_DEVICES"
          echo "cpu_count=$(nproc)"
      - name: Install data tools
        run: python -m pip install "datasets>=4.0" "huggingface_hub>=0.30" "tokenizers>=0.20" "pillow>=10" "kaggle>=2.2.1" numpy
      - name: Build v0.7 bilingual chat code tool and desktop-action data
        run: |
          set -euo pipefail
          python flm/data/prepare_v07.py \
            --out prepared_v07 \
            --owner "$KAGGLE_OWNER" \
            --main-bytes 1024000000 \
            --coder-bytes 256000000 \
            --vocab-size 16384 \
            --tr-sft-per-source 60000 \
            --en-sft-rows 120000 \
            --coder-sft-code-rows 60000 \
            --tool-sft-rows 60000 \
            --synthetic-tool-rows 6000 \
            --rexx-trajectories 320
      - name: Verify v0.7 scale and semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('prepared_v07')
          x=json.loads((root/'sources.json').read_text())
          s=x['stats']
          assert x['pipeline_version']=='v0.7'
          assert s['main_raw']['bytes'] >= 1_000_000_000, s['main_raw']
          assert s['main_raw']['turkish']['bytes'] >= 500_000_000
          assert s['main_raw']['english']['bytes'] >= 500_000_000
          assert s['coder_raw']['content_bytes'] >= 245_000_000, s['coder_raw']
          assert s['tokenizer']['vocab_size'] >= 16000
          assert s['main']['tokens'] >= 100_000_000, s['main']
          assert s['coder']['tokens'] >= 20_000_000, s['coder']
          assert s['main_sft']['rows'] >= 150_000, s['main_sft']
          assert s['main_sft']['supervised_tokens'] >= 5_000_000
          assert s['coder_sft_raw']['sources']['xlam_tools'] >= 20_000
          assert s['coder_sft']['supervised_tokens'] >= 2_000_000
          assert s['computer_rexx']['examples'] >= 500, s['computer_rexx']
          for op in ('CLICK','TYPE','KEY'):
              assert s['computer_rexx']['ops'].get(op,0)>0, (op,s['computer_rexx']['ops'])
          for name in (
              'main_train.u16','coder_train.u16',
              'main_sft_tokens.u16','main_sft_mask.u8',
              'coder_sft_tokens.u16','coder_sft_mask.u8',
              'cu07_manifest.jsonl','tokenizer.json',
          ):
              p=root/name
              assert p.is_file() and p.stat().st_size>1000,(name,p.stat().st_size if p.exists() else 0)
          print('V07_DATA_VERIFIED')
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY
          du -sh prepared_v07
      - name: Upload/version private Kaggle v0.7 dataset
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/flm-hf-v07"
          if kaggle datasets list --mine -s flm-hf-v07 -v | grep -Fq "$REF"; then
            kaggle datasets version -p prepared_v07 -m "FLM v0.7 bilingual BPE + chat/code/tool SFT + REXX desktop actions" -q -t -r skip
          else
            kaggle datasets create -p prepared_v07 -q -t -r skip
          fi
          for attempt in $(seq 1 90); do
            if kaggle datasets files "$REF" --page-size 50; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: flm-v07-data-manifest
          path: |
            prepared_v07/sources.json
            prepared_v07/tokenizer_meta.json
          retention-days: 14
