name: FLM v0.6 Overnight Full GPU

on:
  workflow_run:
    workflows:
      - "FLM v0.6 GPU Pilot"
    types:
      - completed
  push:
    paths:
      - '.flm-v06-full-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v06-full-gpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Build full v0.6 kernel
        run: python scripts/build_kernel_bundle_v06.py --owner "$KAGGLE_OWNER" --profile full --out kernel_v06_full
      - name: Submit overnight training to 2xT4
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 8); do
            OUTPUT="$(kaggle kernels push -p kernel_v06_full --accelerator NvidiaTeslaT4 --timeout 43200 2>&1 || true)"
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q 'successfully pushed'; then
              ok=1
              break
            fi
            if echo "$OUTPUT" | grep -qi 'Maximum batch GPU session count'; then
              sleep 30
              continue
            fi
            exit 1
          done
          test "$ok" = "1"
      - name: Verify full session started
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(QUEUED|RUNNING|COMPLETE)'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
