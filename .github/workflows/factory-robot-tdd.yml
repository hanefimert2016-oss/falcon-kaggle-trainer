name: Factory Robot TDD

on:
  push:
    branches: [factory-robot-cinematic-impl]
    paths:
      - 'factory_robot_3d/**'
      - 'tests/factory_robot_3d/**'
      - '.github/workflows/factory-robot-tdd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install robot test dependencies
        run: python -m pip install -q pytest numpy
      - name: Run robot factory tests
        run: pytest tests/factory_robot_3d -q
