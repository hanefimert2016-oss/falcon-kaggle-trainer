name: Kaggle Auth Test

on:
  push:
    paths:
      - '.github/workflows/kaggle-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate GitHub configuration
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing KAGGLE_API_TOKEN secret" && exit 1)
          test -n "$KAGGLE_OWNER" || (echo "Missing KAGGLE_OWNER repository variable" && exit 1)
          echo "KAGGLE_OWNER=$KAGGLE_OWNER"
      - name: Install Kaggle CLI
        run: python -m pip install "kaggle>=2.2.1"
      - name: Authenticate against Kaggle
        run: |
          kaggle kernels list --mine --page-size 1
          echo "Kaggle authentication OK"
