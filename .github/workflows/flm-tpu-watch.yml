name: FLM TPU Smoke Watch

on:
  push:
    paths:
      - '.flm-tpu-watch-trigger'

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install "kaggle>=2.2.1"

      - name: Resolve TPU kernel ref
        run: |
          set -euo pipefail
          for REF in             "$KAGGLE_OWNER/falcon-flm-v04-three-model-suite-tpu"             "$KAGGLE_OWNER/falcon-flm-v04-three-model-tpu-smoke"; do
            if kaggle kernels status "$REF" > /tmp/status.txt 2>&1; then
              echo "TPU_REF=$REF" >> "$GITHUB_ENV"
              cat /tmp/status.txt
              exit 0
            fi
          done
          cat /tmp/status.txt || true
          echo "Could not resolve TPU kernel ref"
          exit 1

      - name: Wait for TPU training
        run: |
          set -euo pipefail
          complete=0
          for attempt in $(seq 1 120); do
            STATUS="$(kaggle kernels status "$TPU_REF" 2>&1 || true)"
            echo "attempt=$attempt $STATUS"
            if echo "$STATUS" | grep -q 'KernelWorkerStatus.COMPLETE'; then
              complete=1
              break
            fi
            if echo "$STATUS" | grep -Eq 'KernelWorkerStatus.(ERROR|FAILED|CANCELLED)'; then
              kaggle kernels logs "$TPU_REF" || true
              exit 1
            fi
            sleep 10
          done
          test "$complete" = "1"

      - name: Verify XLA training logs
        run: |
          set -euo pipefail
          kaggle kernels logs "$TPU_REF" | tee /tmp/tpu.log
          grep -q '"accelerator": "tpu"' /tmp/tpu.log
          grep -q '"kind": "main"' /tmp/tpu.log
          grep -q '"kind": "computer_use"' /tmp/tpu.log
          grep -q '"kind": "coder"' /tmp/tpu.log
          grep -q 'suite_complete' /tmp/tpu.log

      - name: Download TPU checkpoints
        run: |
          set -euo pipefail
          mkdir -p outputs
          kaggle kernels output "$TPU_REF" -p outputs -o
          ROOT="outputs/flm-v0.4"
          test -s "$ROOT/main/checkpoint.pt"
          test -s "$ROOT/computer_use/checkpoint.pt"
          test -s "$ROOT/coder/checkpoint.pt"
          test -s "$ROOT/main/metrics.json"
          test -s "$ROOT/computer_use/metrics.json"
          test -s "$ROOT/coder/metrics.json"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/flm-v0.4')
          for name in ('main','computer_use','coder'):
              m=json.loads((root/name/'metrics.json').read_text())
              print(name,json.dumps(m,sort_keys=True))
              assert m['accelerator']=='tpu'
              assert m['parameters']>0
              assert m['eval_loss']>0
          print('TPU THREE-MODEL SMOKE VERIFIED')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: flm-v04-tpu-real-hf-smoke
          path: outputs/flm-v0.4/
          if-no-files-found: error
          retention-days: 7
