name: FLM Fast Accelerator Race

on:
  push:
    paths:
      - '.flm-fast-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: gpu
            accelerator: NvidiaTeslaT4
            slug: falcon-flm-v04-fast-gpu
          - backend: tpu
            accelerator: TpuV5E8
            slug: falcon-flm-v04-fast-tpu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install "kaggle>=2.2.1"

      - name: Verify prepared real HF dataset
        run: kaggle datasets files "$KAGGLE_OWNER/flm-hf-v04" --page-size 5

      - name: Build tiny real-data accelerator bundle
        run: |
          python scripts/build_kernel_bundle.py \
            --owner "$KAGGLE_OWNER" \
            --accelerator "${{ matrix.accelerator }}" \
            --profile fast \
            --slug "${{ matrix.slug }}" \
            --out "kernel_${{ matrix.backend }}"
          python - <<'PY'
          import json, pathlib
          backend = "${{ matrix.backend }}"
          p = pathlib.Path(f"kernel_{backend}/kernel-metadata.json")
          m = json.loads(p.read_text())
          print(json.dumps(m, indent=2))
          assert m["enable_internet"] is False
          assert m["dataset_sources"] == [f"${{ env.KAGGLE_OWNER }}/flm-hf-v04"]
          PY

      - name: Submit fast real-data training
        run: |
          kaggle kernels push \
            -p "kernel_${{ matrix.backend }}" \
            --accelerator "${{ matrix.accelerator }}" \
            --timeout 3600

      - name: Show immediate status
        run: |
          sleep 2
          kaggle kernels status "$KAGGLE_OWNER/${{ matrix.slug }}" || true
