name: FLM Fast GPU Train

on:
  push:
    paths:
      - '.flm-fast-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      ACCELERATOR: NvidiaTeslaT4
      KERNEL_SLUG: falcon-flm-v04-fast-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install "kaggle>=2.2.1"

      - name: Verify CPU-prepared real HF dataset
        run: kaggle datasets files "$KAGGLE_OWNER/flm-hf-v04" --page-size 5

      - name: Build fast 2xT4 real-data bundle
        run: |
          python scripts/build_kernel_bundle.py \
            --owner "$KAGGLE_OWNER" \
            --accelerator "$ACCELERATOR" \
            --profile fast \
            --slug "$KERNEL_SLUG" \
            --out kernel_gpu
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('kernel_gpu/kernel-metadata.json').read_text())
          print(json.dumps(m,indent=2))
          assert m['enable_gpu'] is True
          assert m['machine_shape']=='NvidiaTeslaT4'
          assert m['enable_internet'] is False
          PY

      - name: Submit fast GPU training
        run: |
          kaggle kernels push \
            -p kernel_gpu \
            --accelerator "$ACCELERATOR" \
            --timeout 3600

      - name: Show immediate GPU status
        run: |
          sleep 2
          kaggle kernels status "$KAGGLE_OWNER/$KERNEL_SLUG" || true
