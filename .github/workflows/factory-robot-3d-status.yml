name: Factory Robot Cinematic - Kaggle Status Probe

on:
  push:
    branches: [factory-robot-cinematic-impl]
    paths:
      - '.github/workflows/factory-robot-3d-status.yml'
      - '.factory-robot-cinematic-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: factory-robot-cinematic-t4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1"
      - name: Production kernel status and recent logs
        shell: bash
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/$KERNEL_SLUG"
          echo "=== my kernels ==="
          kaggle kernels list --mine -v --page-size 50 || true
          echo "=== status: $REF ==="
          kaggle kernels status "$REF" || true
          echo '--- output files probe ---'
          kaggle kernels files "$REF" -v --page-size 20 || true
          echo '--- recent log tail ---'
          kaggle kernels logs "$REF" 2>&1 | tail -n 160 || true
