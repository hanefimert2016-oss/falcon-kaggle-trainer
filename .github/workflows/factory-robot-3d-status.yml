name: Factory Robot 3D - Kaggle Status Probe

on:
  push:
    branches: [factory-robot-3d-t4-simulation]
    paths:
      - '.github/workflows/factory-robot-3d-t4-simulation-status.yml'
      - '.factory-robot-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1"
      - name: Kernel status
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "$KAGGLE_OWNER/factory-robot-3d-t4-simulation"
          echo "--- recent log tail ---"
          kaggle kernels logs "$KAGGLE_OWNER/factory-robot-3d-t4-simulation" 2>&1 | tail -n 80 || true
