name: Factory Robot Cinematic - Kaggle Status Probe

on:
  push:
    branches: [factory-robot-cinematic-impl]
    paths:
      - '.github/workflows/factory-robot-3d-status.yml'
      - '.factory-robot-cinematic-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: factory-robot-cinematic-t4-production
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install -q "kaggle>=2.2.1"

      - name: Production kernel status and render diagnostics
        shell: bash
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/$KERNEL_SLUG"

          echo "=== status: $REF ==="
          STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
          echo "$STATUS"

          echo '--- recent kernel log tail ---'
          kaggle kernels logs "$REF" 2>&1 | tail -n 300 || true

          if echo "$STATUS" | grep -Eqi 'QUEUED|RUNNING'; then
            echo 'CINEMATIC_PROBE_ACTIVE: kernel still running'
            exit 0
          fi

          echo '--- output files probe ---'
          kaggle kernels files "$REF" -v --page-size 50 || true
