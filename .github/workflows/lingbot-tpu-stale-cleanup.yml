name: LingBot TPU Stale Cleanup

on:
  push:
    branches:
      - lingbot-tpu-v5e-port
    paths:
      - '.lingbot-tpu-cleanup-trigger'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      STALE_SLUG: lingbot-world-v2-1-3b-tpu-v5e-8-smoke
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q "kaggle>=2.2.1"
      - name: Remove stale smoke kernel
        shell: bash
        run: |
          set -euo pipefail
          REF="$KAGGLE_OWNER/$STALE_SLUG"
          echo "Before:"
          kaggle kernels status "$REF" || true
          kaggle kernels delete "$REF" -y
          echo "Deleted stale smoke kernel: $REF"
