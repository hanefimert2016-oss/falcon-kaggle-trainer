name: Factory Robot Fast T4 MP4 Delivery

on:
  push:
    branches: [factory-robot-cinematic-impl]
    paths:
      - '.github/workflows/factory-robot-fast-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-robot-fast-delivery
  cancel-in-progress: false

jobs:
  render-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      KERNEL_SLUG: factory-robot-cinematic-fast-delivery
      ACCELERATOR: NvidiaTeslaT4
      REF: ${{ vars.KAGGLE_OWNER }}/factory-robot-cinematic-fast-delivery
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: python -m pip install -q "kaggle>=2.2.1" pytest numpy pybullet

      - name: Verify robot suite
        run: pytest tests/factory_robot_3d -q

      - name: Build fast cinematic bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('factory_robot_3d/blender/render_config.py')
          text=p.read_text(encoding='utf-8')
          old='samples=64,'
          if old not in text:
              raise SystemExit('expected production sample setting not found')
          p.write_text(text.replace(old,'samples=16,',1),encoding='utf-8')
          print('FAST_RENDER_SAMPLES=16')
          PY
          rm -rf kernel_factory_robot_fast
          mkdir -p kernel_factory_robot_fast
          python -m factory_robot_3d.pipeline.build_kaggle_bundle             --template factory_robot_3d/kaggle_entrypoint.py             --package-root factory_robot_3d             --output kernel_factory_robot_fast/kaggle_entrypoint.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('factory_robot_3d/kernel-metadata.template.json').read_text(encoding='utf-8'))
          data['id']=f"{os.environ['KAGGLE_OWNER']}/{os.environ['KERNEL_SLUG']}"
          data['title']='Factory Robot Cinematic Fast Delivery'
          Path('kernel_factory_robot_fast/kernel-metadata.json').write_text(
              json.dumps(data,indent=2)+'\n',encoding='utf-8'
          )
          print(json.dumps(data,indent=2))
          PY

      - name: Push fast T4 kernel
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            set +e
            OUT="$(kaggle kernels push -p kernel_factory_robot_fast --accelerator "$ACCELERATOR" --timeout 3600 2>&1)"
            RC=$?
            set -e
            echo "$OUT"
            if [[ "$RC" -eq 0 ]]; then
              echo "FAST_GPU_SLOT_ACQUIRED attempt=$attempt"
              exit 0
            fi
            if echo "$OUT" | grep -Fiq 'Maximum batch GPU session count'; then
              echo "FAST_GPU_SLOT_RETRY attempt=$attempt/120"
              sleep 30
              continue
            fi
            exit "$RC"
          done
          exit 86

      - name: Wait for fast render
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 1200); do
            STATUS="$(kaggle kernels status "$REF" 2>&1 || true)"
            echo "[$i] $STATUS"
            if echo "$STATUS" | grep -Eqi 'COMPLETE|FINISHED'; then
              exit 0
            fi
            if echo "$STATUS" | grep -Eqi 'ERROR|FAILED|CANCEL_ACKNOWLEDGED|CANCELLED'; then
              kaggle kernels logs "$REF" || true
              exit 1
            fi
            sleep 15
          done
          exit 1

      - name: Show fast render logs
        if: always()
        run: kaggle kernels logs "$REF" 2>&1 | tail -n 300 || true

      - name: Download fast MP4 output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fast_output
          mkdir -p fast_output
          kaggle kernels output "$REF" -p fast_output -o
          find fast_output -type f -printf '%p %s bytes\n' | sort
          MP4="$(find fast_output -type f -name 'factory_robot_cinematic.mp4' | head -n1)"
          test -n "$MP4"
          echo "MP4=$MP4" >> "$GITHUB_ENV"
          ROOT="$(dirname "$MP4")"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Validate fast MP4
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python -m factory_robot_3d.pipeline.validate_video "$MP4"

      - name: Upload fast final MP4 bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: factory-robot-fast-final-mp4
          path: ${{ env.ROOT }}/
          if-no-files-found: error
          retention-days: 14
