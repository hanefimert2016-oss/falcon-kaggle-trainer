name: Unity Action Story CPU

on:
  push:
    branches: [main]
    paths:
      - 'gpu_jobs/echo_protocol_blacksite/**'
      - '.github/workflows/unity-action-story-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Unity source
        run: tar -xzf gpu_jobs/echo_protocol_blacksite/echo_protocol_blacksite_source.tar.gz

      - name: Show CPU and disk
        run: |
          echo "CPU cores: $(nproc)"
          free -h
          df -h

      - name: Fetch external CC0 3D assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          ./unity_action_game/tools/fetch_external_assets.sh

      - name: Validate Unity action-story project
        run: python3 ./unity_action_game/tools/validate_project.py

      - name: Inventory external models
        run: |
          find unity_action_game/Assets/External -type f \( -iname '*.fbx' -o -iname '*.obj' \) | sort > unity_action_game/external_model_inventory.txt
          echo "Model files: $(wc -l < unity_action_game/external_model_inventory.txt)"
          head -40 unity_action_game/external_model_inventory.txt

      - name: Upload ready Unity project
        uses: actions/upload-artifact@v4
        with:
          name: echo-protocol-blacksite-unity-project
          path: |
            unity_action_game
            !unity_action_game/.asset-cache
          compression-level: 6
          retention-days: 14
