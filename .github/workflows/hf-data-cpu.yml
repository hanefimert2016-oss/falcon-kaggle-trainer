name: FLM HF Data CPU Prep

on:
  push:
    paths:
      - '.hf-data-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU data tools
        run: python -m pip install "datasets>=4.0" pillow "kaggle>=2.2.1"

      - name: Download and prepare real Hugging Face data on CPU
        run: |
          test -n "$KAGGLE_OWNER"
          python flm/data/prepare_hf.py --out prepared_hf --owner "$KAGGLE_OWNER"

      - name: Verify prepared dataset
        run: |
          test -s prepared_hf/main_train.txt
          test -s prepared_hf/coder_train.jsonl
          test -s prepared_hf/computer_manifest.jsonl
          test -s prepared_hf/computer_images.zip
          cat prepared_hf/sources.json
          du -h prepared_hf/*

      - name: Upload or version private Kaggle CPU-prepared dataset
        run: |
          REF="$KAGGLE_OWNER/flm-hf-v04"
          if kaggle datasets status "$REF" >/dev/null 2>&1; then
            kaggle datasets version -p prepared_hf -m "Refresh HF CPU-prepared training shard" -q -t -r skip
          else
            kaggle datasets create -p prepared_hf -q -t -r skip
          fi
          kaggle datasets status "$REF"

      - uses: actions/upload-artifact@v4
        with:
          name: flm-hf-v04-cpu-prepared
          path: |
            prepared_hf/sources.json
            prepared_hf/main_train.txt
            prepared_hf/coder_train.jsonl
            prepared_hf/computer_manifest.jsonl
          retention-days: 3
