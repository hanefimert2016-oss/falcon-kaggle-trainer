name: FLM v0.6 Full Status

on:
  push:
    paths:
      - '.flm-v06-status-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v06-full-gpu
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "kaggle>=2.2.1"
      - name: Status
        run: kaggle kernels status "$REF"
      - name: Recent logs
        run: kaggle kernels logs "$REF" 2>&1 | tail -n 400 || true
