name: FLM v0.7 Quality Training Gate

on:
  workflow_run:
    workflows:
      - "FLM v0.7 DEV Text Repair"
    types:
      - completed
  push:
    paths:
      - '.flm-v07-dev-gate-trigger'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flm-v07-quality-training-gate
  cancel-in-progress: false

jobs:
  launch-quality-training:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      TEXT_REF: ${{ vars.KAGGLE_OWNER }}/flm-v07-semantic-text-r6
      GPU_REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-semantic-interface-gpu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install "kaggle>=2.2.1"

      - name: Verify Semantic FLM text r6 dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v07-gate-data
          mkdir -p /tmp/v07-gate-data/text

          kaggle datasets files "$TEXT_REF" --page-size 100 | tee /tmp/v07-text-files.txt
          for F in tokenizer.json main_train.u16 coder_train.u16 main_sft_tokens.u16 main_sft_mask.u8 semantic_sft_tokens.u16 semantic_sft_mask.u8 coder_sft_tokens.u16 coder_sft_mask.u8 sources.json; do
            grep -Fq "$F" /tmp/v07-text-files.txt
          done
          kaggle datasets download -d "$TEXT_REF" -f sources.json -p /tmp/v07-gate-data/text -q --force

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/v07-gate-data/text/sources.json')
          t=json.loads(p.read_text(encoding='utf-8'))
          assert t.get('pipeline_version')=='v0.7-dev-text'
          assert int(t.get('data_revision',0))>=6,t.get('data_revision')
          s=t.get('stats') or {}
          assert int((s.get('main') or {}).get('tokens',0))>=1_000_000_000
          assert int((s.get('coder') or {}).get('tokens',0))>=175_000_000
          assert int((s.get('main_sft') or {}).get('supervised_tokens',0))>=450_000_000
          assert int((s.get('coder_sft') or {}).get('supervised_tokens',0))>=75_000_000
          sem=s.get('semantic_interface_sft') or {}
          assert int(sem.get('rows',0))>=550_000
          assert sem.get('anti_copy_verified') is True
          assert int((s.get('semantic_sft') or {}).get('supervised_tokens',0))>=120_000_000
          langs=sem.get('language_counts') or {}
          assert int(langs.get('tr',0))>=290_000 and int(langs.get('en',0))>=290_000
          modes=sem.get('mode_counts') or {}
          assert len(modes)>=16 and min(map(int,modes.values()))>=35_000
          assert int((s.get('tokenizer') or {}).get('vocab_size',0))>=30_000
          print('SEMANTIC_FLM_TEXT_R5_READY',s.get('main'),s.get('coder'),s.get('semantic_interface_sft'))
          PY

      - name: Build quality GPU bundle
        run: |
          set -euo pipefail
          python scripts/build_v07_dev_gpu_kernel.py \
            --owner "$KAGGLE_OWNER" \
            --out kernel_v07_semantic_interface
          python -m py_compile kernel_v07_semantic_interface/train_interface_v07.py

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('kernel_v07_semantic_interface/kernel-metadata.json').read_text())
          owner=m['id'].split('/')[0]
          assert m['id']==f'{owner}/falcon-flm-v07-semantic-interface-gpu',m
          assert m['title']=='Falcon FLM v07 Semantic Interface Transformer',m
          assert m['dataset_sources']==[f'{owner}/flm-v07-semantic-text-r6'],m
          assert m['kernel_sources']==[],m
          assert m['enable_gpu'] is True
          assert m['enable_internet'] is False
          assert m['machine_shape']=='NvidiaTeslaT4'
          src=Path('kernel_v07_semantic_interface/train_interface_v07.py').read_text()
          for expected in (
              'flm.train_interface_v07',
              'FLM_INTERFACE_SEQ',
              '4096',
              'FLM_INTERFACE_LAYERS',
              '16',
              'FLM_INTERFACE_KV_HEADS',
              '4',
              'FLM_INTERFACE_GENERAL_SEQ',
              '1024',
              'FLM_INTERFACE_CODE_SEQ',
              '2048',
              'FLM_INTERFACE_REFRESH_SEQ',
              'FLM_INTERFACE_REFRESH_EPOCHS',
              '0.12',
              'FLM_INTERFACE_SFT_SEQ',
              '4096',
          ):
              assert expected in src,expected
          print('V07_SINGLE_INTERFACE_GPU_BUNDLE_VERIFIED')
          PY

      - name: Avoid duplicate running quality job
        id: duplicate
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status "$GPU_REF" 2>&1 || true)"
          echo "$STATUS"
          if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(QUEUED|RUNNING)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "V07_INTERFACE_GPU_ALREADY_ACTIVE"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Launch quality model training
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 300); do
            STATUS="$(kaggle kernels status "$GPU_REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(QUEUED|RUNNING)'; then
              echo "V07_INTERFACE_GPU_STARTED_BY_ANOTHER_RUN"
              exit 0
            fi

            OUTPUT="$(kaggle kernels push \
              -p kernel_v07_semantic_interface \
              --accelerator NvidiaTeslaT4 \
              --timeout 43200 2>&1 || true)"
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q 'successfully pushed'; then
              ok=1
              break
            fi
            if echo "$OUTPUT" | grep -Eqi \
              'Maximum batch GPU session count|429|rate.?limit|temporar|timeout|502|503|504'; then
              sleep 60
              continue
            fi
            break
          done
          test "$ok" = "1"

      - name: Verify quality training is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            STATUS="$(kaggle kernels status "$GPU_REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(QUEUED|RUNNING|COMPLETE)'; then
              echo "V07_INTERFACE_TRAINING_LIVE"
              exit 0
            fi
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(ERROR|FAILED|CANCELLED)'; then
              kaggle kernels logs "$GPU_REF" || true
              exit 1
            fi
            sleep 5
          done
          exit 1
