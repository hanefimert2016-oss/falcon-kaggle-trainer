name: FLM v0.7 Tokenizer-Only Gate

on:
  workflow_run:
    workflows:
      - "FLM v0.7 Zero-Train Data"
    types:
      - completed
  push:
    paths:
      - '.flm-v07-dev-gate-trigger'
      - 'scripts/build_v07_tokenizer_kernel.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flm-v07-tokenizer-only-gate
  cancel-in-progress: false

jobs:
  launch-tokenizer:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}
      TEXT_REF: ${{ vars.KAGGLE_OWNER }}/flm-v07-zero-train-data-r1
      TOKENIZER_REF: ${{ vars.KAGGLE_OWNER }}/falcon-flm-v07-tokenizer-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install "kaggle>=2.2.1" "tokenizers>=0.20"

      - name: Verify zero-train source dataset
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets files "$TEXT_REF" --page-size 100 | tee /tmp/flm-files.txt
          grep -Fq "main.raw.txt" /tmp/flm-files.txt
          grep -Fq "coder_pretrain.jsonl" /tmp/flm-files.txt
          grep -Fq "semantic_wikidata.jsonl" /tmp/flm-files.txt
          grep -Fq "turkish_lexicon.jsonl" /tmp/flm-files.txt
          echo "FLM_ZERO_TRAIN_SOURCE_READY"

      - name: Build tokenizer-only Kaggle bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_v07_tokenizer_kernel.py             --owner "$KAGGLE_OWNER"             --dataset flm-v07-zero-train-data-r1             --vocab-size 32768             --out kernel_v07_tokenizer_only
          python -m py_compile kernel_v07_tokenizer_only/train_tokenizer.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('kernel_v07_tokenizer_only/kernel-metadata.json').read_text())
          assert m['id'].endswith('/falcon-flm-v07-tokenizer-only'),m
          assert m['enable_gpu'] is False,m
          assert m['model_sources']==[],m
          src=Path('kernel_v07_tokenizer_only/train_tokenizer.py').read_text()
          assert 'BpeTrainer' in src
          assert 'InterfaceTransformer' not in src
          assert 'torch' not in src
          print('FLM_TOKENIZER_ONLY_BUNDLE_OK')
          PY

      - name: Launch tokenizer-only Kaggle job
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status "$TOKENIZER_REF" 2>&1 || true)"
          echo "$STATUS"
          if ! echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(QUEUED|RUNNING)'; then
            kaggle kernels push -p kernel_v07_tokenizer_only --timeout 43200
          fi

      - name: Wait for tokenizer output
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            STATUS="$(kaggle kernels status "$TOKENIZER_REF" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?COMPLETE'; then
              rm -rf /tmp/flm-tokenizer-output
              mkdir -p /tmp/flm-tokenizer-output
              kaggle kernels output "$TOKENIZER_REF" -p /tmp/flm-tokenizer-output -q
              find /tmp/flm-tokenizer-output -type f -maxdepth 4 -print
              TOK="$(find /tmp/flm-tokenizer-output -name tokenizer.json -type f | head -n1)"
              META="$(find /tmp/flm-tokenizer-output -name tokenizer_meta.json -type f | head -n1)"
              test -n "$TOK" -a -f "$TOK"
              test -n "$META" -a -f "$META"
              python - "$TOK" "$META" <<'PY'
          import json,sys
          from tokenizers import Tokenizer
          tok=Tokenizer.from_file(sys.argv[1])
          meta=json.load(open(sys.argv[2],encoding='utf-8'))
          assert meta['training_kind']=='tokenizer-only-no-neural-model'
          assert int(meta['vocab_size'])>=30000,meta
          for token in ('<unk>','<|semantic_ir|>','<|core_result|>'):
              assert tok.token_to_id(token) is not None,token
          print('FLM_TOKENIZER_ONLY_VERIFIED',meta['vocab_size'])
          PY
              exit 0
            fi
            if echo "$STATUS" | grep -Eq '(KernelWorkerStatus\.)?(ERROR|FAILED|CANCELLED)'; then
              kaggle kernels logs "$TOKENIZER_REF" || true
              exit 1
            fi
            sleep 30
          done
          exit 1
